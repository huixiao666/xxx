<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✨ 我的电脑 · 分类管理</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            background: #0b0e1a;
            color: #fff;
            touch-action: none;
        }

        /* ===== 桌面背景 ===== */
        #desktop {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at 30% 40%, #1a1f3a, #0b0e1a 70%);
            overflow: hidden;
            touch-action: none;
        }
        .star {
            position: absolute;
            border-radius: 50%;
            background: #fff;
            animation: twinkle var(--dur) ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.15; transform: scale(0.7); }
            100% { opacity: 1; transform: scale(1.3); }
        }

        /* ===== 桌面上的“我的电脑”大图标 (左上角) ===== */
        #myComputerDesktop {
            position: absolute;
            left: 36px;
            top: 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            touch-action: manipulation;
            padding: 16px 12px 12px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            width: 130px;
            height: 130px;
        }
        #myComputerDesktop:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.04);
        }
        #myComputerDesktop:active {
            transform: scale(0.94);
        }
        #myComputerDesktop .big-icon {
            font-size: 72px;
            line-height: 1;
            filter: drop-shadow(0 8px 24px rgba(0,0,0,0.6));
            margin-bottom: 8px;
        }
        #myComputerDesktop .big-label {
            font-size: 18px;
            font-weight: 500;
            text-shadow: 0 2px 12px rgba(0,0,0,0.8);
            letter-spacing: 0.5px;
            background: rgba(0,0,0,0.30);
            padding: 2px 16px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
        }
        @media (max-width: 768px) {
            #myComputerDesktop {
                left: 20px;
                top: 20px;
                width: 100px;
                height: 100px;
                padding: 12px 10px 10px;
            }
            #myComputerDesktop .big-icon { font-size: 52px; }
            #myComputerDesktop .big-label { font-size: 15px; padding: 2px 12px; }
        }
        @media (max-width: 480px) {
            #myComputerDesktop {
                left: 14px;
                top: 14px;
                width: 80px;
                height: 80px;
                padding: 8px 6px 6px;
                border-radius: 12px;
            }
            #myComputerDesktop .big-icon { font-size: 40px; }
            #myComputerDesktop .big-label { font-size: 12px; padding: 1px 10px; }
        }

        /* ===== 窗口容器 ===== */
        #windows {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 52px);
            pointer-events: none;
            z-index: 100;
        }
        #windows>* { pointer-events: auto; }

        .window {
            position: absolute;
            min-width: 300px;
            min-height: 200px;
            max-width: 92vw;
            max-height: 85vh;
            background: rgba(22, 28, 50, 0.78);
            backdrop-filter: blur(24px) saturate(1.2);
            border: 1px solid rgba(255,255,255,0.13);
            border-radius: 16px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04) inset;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: windowIn 0.26s cubic-bezier(0.34, 1.56, 0.64, 1);
            transition: box-shadow 0.25s;
            touch-action: none;
        }
        .window.active {
            box-shadow: 0 28px 96px rgba(0,0,0,0.85), 0 0 0 1px rgba(255,255,255,0.10) inset;
        }
        .window.fullscreen {
            width: 100% !important;
            height: 100% !important;
            max-width: 100% !important;
            max-height: 100% !important;
            top: 0 !important;
            left: 0 !important;
            border-radius: 0;
            z-index: 9999 !important;
        }
        @keyframes windowIn {
            0% { opacity: 0; transform: scale(0.92) translateY(18px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .win-titlebar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px 8px 18px;
            background: rgba(255,255,255,0.04);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            flex-shrink: 0;
            cursor: grab;
            min-height: 44px;
            touch-action: none;
        }
        .win-titlebar:active { cursor: grabbing; }
        .win-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: rgba(255,255,255,0.88);
        }
        .win-title .win-icon { font-size: 18px; opacity: 0.8; }
        .win-controls {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .win-controls button {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            touch-action: manipulation;
        }
        .win-controls button:hover {
            background: rgba(255,255,255,0.14);
            color: #fff;
        }
        .win-controls .btn-fullscreen:hover {
            background: rgba(76, 201, 240, 0.3);
            color: #4cc9f0;
        }
        .win-controls .btn-close:hover {
            background: #e74c3c;
            color: #fff;
            transform: scale(1.08);
        }
        .win-controls .btn-min:hover {
            background: rgba(255,255,255,0.18);
        }

        .win-body {
            flex: 1;
            padding: 16px 20px 20px;
            overflow-y: auto;
            color: rgba(255,255,255,0.92);
            font-size: 14px;
            line-height: 1.6;
            -webkit-overflow-scrolling: touch;
        }
        .win-body::-webkit-scrollbar { width: 4px; }
        .win-body::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.20);
            border-radius: 8px;
        }
        .win-body.iframe-body {
            padding: 0;
            overflow: hidden;
        }
        .win-body.iframe-body iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ===== 缩放手柄 ===== */
        .win-resize {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 18px;
            height: 18px;
            cursor: nwse-resize;
            background: transparent;
            z-index: 10;
            touch-action: none;
        }
        .win-resize::after {
            content: "";
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            border-right: 2px solid rgba(255,255,255,0.25);
            border-bottom: 2px solid rgba(255,255,255,0.25);
            border-radius: 0 0 4px 0;
            transition: border-color 0.2s;
        }
        .win-resize:hover::after,
        .win-resize:active::after {
            border-color: rgba(255,255,255,0.6);
        }

        /* ===== “我的电脑”窗口内容样式 ===== */
        .mycomputer-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: 100%;
        }
        .mycomputer-container .toolbar {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .mycomputer-container .add-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            padding: 8px 18px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
            touch-action: manipulation;
        }
        .mycomputer-container .add-btn:hover {
            background: rgba(255,255,255,0.16);
        }
        .mycomputer-container .add-btn:active {
            transform: scale(0.96);
        }

        /* ===== 文件夹网格 ===== */
        .folder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            flex: 1;
            align-content: start;
        }
        .folder-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px 8px 12px;
            border-radius: 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, transform 0.15s;
            touch-action: manipulation;
        }
        .folder-item:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.15);
        }
        .folder-item:active {
            transform: scale(0.94);
        }
        .folder-item .folder-emoji {
            font-size: 42px;
            line-height: 1.2;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
        }
        .folder-item .folder-name {
            font-size: 13px;
            font-weight: 500;
            margin-top: 6px;
            text-align: center;
            color: rgba(255,255,255,0.85);
        }
        .folder-item .folder-count {
            font-size: 11px;
            color: rgba(255,255,255,0.35);
            margin-top: 2px;
        }

        /* ===== 分类视图 ===== */
        .category-view {
            display: none;
            flex-direction: column;
            gap: 12px;
            height: 100%;
        }
        .category-view.active {
            display: flex;
        }
        .category-view .back-btn {
            background: rgba(255,255,255,0.06);
            border: none;
            color: rgba(255,255,255,0.7);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            transition: background 0.2s;
            align-self: flex-start;
            touch-action: manipulation;
        }
        .category-view .back-btn:hover {
            background: rgba(255,255,255,0.12);
        }
        .category-view .cat-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .category-view .link-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 12px;
            flex: 1;
            align-content: start;
        }
        .category-view .link-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 4px 8px;
            border-radius: 10px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.04);
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, transform 0.15s;
            touch-action: manipulation;
        }
        .category-view .link-item:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.10);
        }
        .category-view .link-item:active {
            transform: scale(0.94);
        }
        .category-view .link-item .link-emoji {
            font-size: 28px;
            line-height: 1.2;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
        }
        .category-view .link-item .link-label {
            font-size: 11px;
            font-weight: 500;
            text-align: center;
            margin-top: 4px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: rgba(255,255,255,0.85);
        }

        /* ===== 底部任务栏 ===== */
        #taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 52px;
            background: rgba(11,14,26,0.75);
            backdrop-filter: blur(20px) saturate(1.4);
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            padding: 0 12px;
            z-index: 999;
            gap: 6px;
            touch-action: manipulation;
        }
        #taskbar .tb-items {
            display: flex;
            gap: 4px;
            flex: 1;
            overflow-x: auto;
            padding: 0 4px;
            -webkit-overflow-scrolling: touch;
        }
        #taskbar .tb-items::-webkit-scrollbar { height: 0; }
        .tb-btn {
            padding: 4px 14px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.75);
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            white-space: nowrap;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 6px;
            touch-action: manipulation;
        }
        .tb-btn:hover {
            background: rgba(255,255,255,0.14);
            color: #fff;
        }
        .tb-btn.active {
            background: rgba(255,255,255,0.16);
            color: #fff;
        }
        #taskbar .tb-time {
            font-size: 13px;
            color: rgba(255,255,255,0.65);
            padding: 0 6px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* ===== 右键菜单 ===== */
        #ctxMenu {
            display: none;
            position: fixed;
            z-index: 9999;
            background: rgba(22,28,50,0.92);
            backdrop-filter: blur(20px) saturate(1.6);
            border-radius: 12px;
            padding: 6px 0;
            min-width: 180px;
            border: 1px solid rgba(255,255,255,0.10);
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            animation: menuIn 0.15s ease;
            touch-action: manipulation;
        }
        @keyframes menuIn {
            0% { opacity: 0; transform: scale(0.96) translateY(-4px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        #ctxMenu .ctx-item {
            padding: 10px 20px;
            font-size: 14px;
            color: rgba(255,255,255,0.85);
            cursor: pointer;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            gap: 12px;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            font-family: inherit;
            touch-action: manipulation;
        }
        #ctxMenu .ctx-item:hover {
            background: rgba(255,255,255,0.08);
        }
        #ctxMenu .ctx-item.danger:hover {
            background: rgba(231,76,60,0.25);
            color: #ff7a6b;
        }
        #ctxMenu .ctx-divider {
            height: 1px;
            background: rgba(255,255,255,0.06);
            margin: 4px 12px;
        }

        @media (max-width: 768px) {
            #taskbar { height: 48px; }
            #windows { height: calc(100% - 48px); }
            .window { min-width: 260px; min-height: 160px; max-width: 94vw; max-height: 78vh; }
            .win-title { font-size: 13px; }
            .win-controls button { width: 28px; height: 28px; font-size: 13px; }
            .tb-btn { font-size: 12px; padding: 3px 10px; }
            #taskbar .tb-time { font-size: 12px; }
            .win-resize { width: 16px; height: 16px; bottom: 3px; right: 3px; }
            .win-resize::after { width: 10px; height: 10px; bottom: 1px; right: 1px; }
            .folder-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
            .category-view .link-grid { grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); }
        }
        @media (max-width: 480px) {
            #taskbar { height: 44px; padding: 0 4px; gap: 4px; }
            #windows { height: calc(100% - 44px); }
            .window { min-width: 200px; min-height: 140px; max-width: 96vw; max-height: 70vh; }
            .win-title { font-size: 12px; }
            .win-controls button { width: 24px; height: 24px; font-size: 11px; }
            .win-body { padding: 12px 14px 16px; font-size: 13px; }
            #taskbar .tb-time { font-size: 11px; padding: 0 4px; }
            .tb-btn { padding: 2px 8px; font-size: 11px; }
            .win-resize { width: 14px; height: 14px; bottom: 2px; right: 2px; }
            .win-resize::after { width: 8px; height: 8px; bottom: 1px; right: 1px; }
            .folder-grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); }
            .category-view .link-grid { grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); }
            .mycomputer-container .add-btn { padding: 6px 14px; font-size: 13px; }
            .folder-item .folder-emoji { font-size: 32px; }
            .folder-item .folder-name { font-size: 11px; }
        }
        @media (hover: none) {
            .folder-item:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.06); }
            .folder-item:active { transform: scale(0.94); }
            .category-view .link-item:hover { background: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.04); }
            .category-view .link-item:active { transform: scale(0.94); }
            .tb-btn:hover { background: rgba(255,255,255,0.06); }
            .win-controls button:hover { background: rgba(255,255,255,0.06); }
            .win-resize:hover::after { border-color: rgba(255,255,255,0.25); }
            #myComputerDesktop:hover { background: rgba(255,255,255,0.03); transform: scale(1); }
            #myComputerDesktop:active { transform: scale(0.94); }
        }
    </style>
</head>
<body>

    <!-- ===== 桌面 ===== -->
    <div id="desktop">
        <div id="myComputerDesktop" title="打开我的电脑">
            <div class="big-icon">💻</div>
            <div class="big-label">我的电脑</div>
        </div>
    </div>

    <!-- ===== 窗口容器 ===== -->
    <div id="windows"></div>

    <!-- ===== 底部任务栏 ===== -->
    <div id="taskbar">
        <div class="tb-items" id="tbItems"></div>
        <div class="tb-time" id="tbTime">--:--:--</div>
    </div>

    <!-- ===== 右键菜单 ===== -->
    <div id="ctxMenu">
        <button class="ctx-item" data-action="open">📂 打开</button>
        <button class="ctx-item" data-action="rename">✏️ 重命名</button>
        <button class="ctx-item danger" data-action="delete">🗑️ 删除</button>
        <div class="ctx-divider"></div>
        <button class="ctx-item" data-action="newLink">🔗 新建快捷方式</button>
    </div>

    <script>
        // ===================================================================
        //  数据：从网站大全转换过来的链接，按分类组织
        // ===================================================================

        const CATEGORIES = {

        const LINK_DATA = [

            { name: "Pika", emoji: "🎥", url: "https://pika.art", category: "AI" },
            { name: "DALL·E 3", emoji: "🖌️", url: "https://openai.com/dall-e-3", category: "AI" },

        function toggleFullscreen(win) {
            const winData = openWindows.find(w => w.element === win);
            if (!winData) return;

            if (winData.isFullscreen) {
                win.classList.add('fullscreen');
                // 如果有iframe，确保iframe也全屏
                const iframe = win.querySelector('iframe');
                if (iframe) {
                    try {
                        if (iframe.requestFullscreen) {
                            iframe.requestFullscreen();
                        }
                    } catch (e) {}
                }
            } else {
                win.classList.remove('fullscreen');
                // 恢复窗口大小
                const cfg = getWindowConfig(win.dataset.winId);
                if (cfg) {
                    win.style.width = cfg.width + 'px';
                    win.style.height = cfg.height + 'px';
                }
                centerWindow(win);
                try {
                    if (document.fullscreenElement) {
                        document.exitFullscreen();
                    }
                } catch (e) {}
            }
            // 更新按钮文字
            const btn = win.querySelector('.btn-fullscreen');
            if (btn) {
                btn.textContent = winData.isFullscreen ? '⛶' : '⛶';
                btn.title = winData.isFullscreen ? '退出全屏' : '全屏';

        // ---- 窗口操作 ----
        function focusWindow(win) {
            winZIndex += 1;
            win.style.zIndex = winZIndex;
            win.classList.add('active');
            $$('.window').forEach(w => { if (w !== win) w.classList.remove('active'); });
            const id = win.dataset.winId;
            $$('.tb-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.winId === id);
            });
        }

        function closeWindow(iconId) {
            const idx = openWindows.findIndex(w => w.id === iconId);
            if (idx === -1) return;
            openWindows[idx].element.remove();
            openWindows.splice(idx, 1);
            updateTaskbar();
            if (openWindows.length > 0) {
                focusWindow(openWindows[openWindows.length - 1].element);
            }
        }

        function minimizeWindow(iconId) {
            const winData = openWindows.find(w => w.id === iconId);
            if (!winData) return;
            const win = winData.element;
            if (winData.minimized) {
                win.style.display = 'flex';
                winData.minimized = false;
            } else {
                win.style.display = 'none';
                winData.minimized = true;
            }
            updateTaskbar();
            if (winData.minimized && win.classList.contains('active')) {
                const others = openWindows.filter(w => w.id !== iconId && !w.minimized);
                if (others.length > 0) focusWindow(others[others.length - 1].element);
            }
        }

        function centerWindow(win) {
            const rect = win.getBoundingClientRect();
            const w = rect.width,
                h = rect.height;
            const left = (window.innerWidth - w) / 2;
            const top = (window.innerHeight - h) / 2 - 20;
            win.style.left = clamp(left, 8, window.innerWidth - w - 8) + 'px';
            win.style.top = clamp(top, 8, window.innerHeight - h - 60) + 'px';
        }

        function getIconById(id) {
            return iconData.find(i => i.id === id);

        function addResizeHandle(win) {
            const handle = document.createElement('div');
            handle.className = 'win-resize';
            win.appendChild(handle);

            handle.addEventListener('mousedown', (e) => {
                e.stopPropagation();
                e.preventDefault();
                startResize(e, win);
            });
            handle.addEventListener('touchstart', (e) => {
                e.stopPropagation();
                if (e.touches.length === 1) {
                    e.preventDefault();
                    startResize(e, win);
                }
            }, { passive: false });
        }

        function startResize(e, win) {
            const isTouch = e.type === 'touchstart';
            const clientX = isTouch ? e.touches[0].clientX : e.clientX;
            const clientY = isTouch ? e.touches[0].clientY : e.clientY;

            const rect = win.getBoundingClientRect();
            resizeData = {
                win: win,
                startX: clientX,
                startY: clientY,
                startWidth: rect.width,
                startHeight: rect.height,
                isTouch: isTouch,
            };

            if (isTouch) {
                document.addEventListener('touchmove', onResizeMoveTouch, { passive: false });
                document.addEventListener('touchend', onResizeEndTouch, { passive: false });
                document.addEventListener('touchcancel', onResizeEndTouch, { passive: false });
            } else {
                document.addEventListener('mousemove', onResizeMoveMouse);
                document.addEventListener('mouseup', onResizeEndMouse);
            }
        }

        function onResizeMoveTouch(e) {
            if (!resizeData || !resizeData.isTouch) return;
            const touch = e.touches[0];
            resizeWindow(touch.clientX, touch.clientY);
            e.preventDefault();
        }

        function onResizeEndTouch(e) {
            if (resizeData && resizeData.isTouch) { resizeData = null; }
            document.removeEventListener('touchmove', onResizeMoveTouch);
            document.removeEventListener('touchend', onResizeEndTouch);
            document.removeEventListener('touchcancel', onResizeEndTouch);
        }

        function onResizeMoveMouse(e) {
            if (!resizeData || resizeData.isTouch) return;
            resizeWindow(e.clientX, e.clientY);
        }

        function onResizeEndMouse(e) {
            if (resizeData && !resizeData.isTouch) { resizeData = null; }
            document.removeEventListener('mousemove', onResizeMoveMouse);
            document.removeEventListener('mouseup', onResizeEndMouse);
        }

        function resizeWindow(clientX, clientY) {
            if (!resizeData) return;
            const { win, startX, startY, startWidth, startHeight } = resizeData;
            const dx = clientX - startX;
            const dy = clientY - startY;

            let newWidth = Math.max(300, startWidth + dx);
            let newHeight = Math.max(200, startHeight + dy);

            const rect = win.getBoundingClientRect();
            const maxW = window.innerWidth - rect.left - 8;
            const maxH = window.innerHeight - rect.top - 60;
            newWidth = Math.min(newWidth, maxW);
            newHeight = Math.min(newHeight, maxH);

            win.style.width = newWidth + 'px';
            win.style.height = newHeight + 'px';
        }

        // ===================================================================
        //  拖动
        // ===================================================================

        function startDrag(e, win) {
            if (resizeData) return;
            const isTouch = e.type === 'touchstart';
            const clientX = isTouch ? e.touches[0].clientX : e.clientX;
            const clientY = isTouch ? e.touches[0].clientY : e.clientY;
            const rect = win.getBoundingClientRect();
            dragData = {
                win: win,
                offsetX: clientX - rect.left,
                offsetY: clientY - rect.top,
                isTouch: isTouch
            };
            if (isTouch) {
                document.addEventListener('touchmove', onDragMoveTouch, { passive: false });
                document.addEventListener('touchend', onDragEndTouch, { passive: false });
                document.addEventListener('touchcancel', onDragEndTouch, { passive: false });
                e.preventDefault();
            } else {
                document.addEventListener('mousemove', onDragMoveMouse);
                document.addEventListener('mouseup', onDragEndMouse);
                e.preventDefault();
            }
        }

        function onDragMoveTouch(e) {
            if (!dragData || !dragData.isTouch) return;
            const touch = e.touches[0];
            moveDrag(touch.clientX, touch.clientY);
            e.preventDefault();
        }

        function onDragEndTouch(e) {
            if (dragData && dragData.isTouch) { dragData = null; }
            document.removeEventListener('touchmove', onDragMoveTouch);
            document.removeEventListener('touchend', onDragEndTouch);
            document.removeEventListener('touchcancel', onDragEndTouch);
        }

        function onDragMoveMouse(e) {
            if (!dragData || dragData.isTouch) return;
            moveDrag(e.clientX, e.clientY);
        }

        function onDragEndMouse(e) {
            if (dragData && !dragData.isTouch) { dragData = null; }
            document.removeEventListener('mousemove', onDragMoveMouse);
            document.removeEventListener('mouseup', onDragEndMouse);
        }

        function moveDrag(clientX, clientY) {
            if (!dragData) return;
            const { win, offsetX, offsetY } = dragData;
            let left = clientX - offsetX;
            let top = clientY - offsetY;
            const maxX = window.innerWidth - win.offsetWidth - 4;
            const maxY = window.innerHeight - win.offsetHeight - 60;
            win.style.left = clamp(left, 4, maxX) + 'px';
            win.style.top = clamp(top, 4, maxY) + 'px';
        }

        // ===================================================================
        //  任务栏更新
        // ===================================================================

        function updateTaskbar() {
            tbItems.innerHTML = '';
            openWindows.forEach(winData => {
                const btn = document.createElement('button');
                btn.className = 'tb-btn';
                if (winData.minimized) btn.style.opacity = '0.5';
                btn.dataset.winId = winData.id;
                btn.innerHTML = `<span class="tb-icon">${winData.icon}</span> ${winData.title}`;
                btn.addEventListener('click', () => {
                    if (winData.minimized) {
                        winData.element.style.display = 'flex';
                        winData.minimized = false;
                        updateTaskbar();
                    }
                    focusWindow(winData.element);
                });
                tbItems.appendChild(btn);
            });
            const activeWin = document.querySelector('.window.active');
            if (activeWin) {
                const id = activeWin.dataset.winId;
                $$('.tb-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.winId === id);
                });
            }
        }

        // ===================================================================
        //  桌面大图标点击事件
        // ===================================================================

        document.getElementById('myComputerDesktop').addEventListener('click', () => {
            openWindow('computer');
        });

        // ===================================================================
        //  窗口自适应
        // ===================================================================

        window.addEventListener('resize', () => {
            openWindows.forEach(winData => {
                const win = winData.element;
                if (winData.minimized || winData.isFullscreen) return;
                const rect = win.getBoundingClientRect();
                const maxX = window.innerWidth - 8;
                const maxY = window.innerHeight - 60;
                if (rect.left > maxX || rect.top > maxY) {
                    win.style.left = clamp(rect.left, 4, maxX - rect.width) + 'px';
                    win.style.top = clamp(rect.top, 4, maxY - rect.height) + 'px';
                }
                const maxW = window.innerWidth - rect.left - 8;
                const maxH = window.innerHeight - rect.top - 60;
                const curW = parseFloat(win.style.width) || rect.width;
                const curH = parseFloat(win.style.height) || rect.height;
                if (curW > maxW) win.style.width = maxW + 'px';
                if (curH > maxH) win.style.height = maxH + 'px';
            });
        });

        // ===================================================================
        //  ESC 关闭窗口 / ESC 退出全屏
        // ===================================================================

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                // 先尝试退出全屏
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                    const fullWin = document.querySelector('.window.fullscreen');
                    if (fullWin) {
                        const wData = openWindows.find(w => w.element === fullWin);
                        if (wData) {
                            wData.isFullscreen = false;
                            fullWin.classList.remove('fullscreen');
                            const cfg = getWindowConfig(fullWin.dataset.winId) || { width: 700, height: 500 };
                            fullWin.style.width = cfg.width + 'px';
                            fullWin.style.height = cfg.height + 'px';
                            centerWindow(fullWin);
                            const btn = fullWin.querySelector('.btn-fullscreen');
                            if (btn) { btn.textContent = '⛶';
                                btn.title = '全屏'; }
                        }
                    }
                    return;
                }
                const active = document.querySelector('.window.active');
                if (active) {
                    const id = active.dataset.winId;
                    const idx = openWindows.findIndex(w => w.element === active);
                    if (idx !== -1) {
                        const winData = openWindows[idx];
                        if (winData.id.startsWith('link_')) {
                            openWindows.splice(idx, 1);
                            active.remove();
                            updateTaskbar();
                            if (openWindows.length > 0) {
                                focusWindow(openWindows[openWindows.length - 1].element);
                            }
                        } else {
                            closeWindow(winData.id);
                        }
                    }
                }
            }
        });

        // 监听全屏变化
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                const fullWin = document.querySelector('.window.fullscreen');
                if (fullWin) {
                    const wData = openWindows.find(w => w.element === fullWin);
                    if (wData) {
                        wData.isFullscreen = false;
                        fullWin.classList.remove('fullscreen');
                        const cfg = getWindowConfig(fullWin.dataset.winId) || { width: 700, height: 500 };
                        fullWin.style.width = cfg.width + 'px';
                        fullWin.style.height = cfg.height + 'px';
                        centerWindow(fullWin);
                        const btn = fullWin.querySelector('.btn-fullscreen');
                        if (btn) { btn.textContent = '⛶';
                            btn.title = '全屏'; }
                    }
                }
            }
        });

        // ===================================================================
        //  初始化
        // ===================================================================

        setTimeout(() => {
            openWindow('computer');
        }, 300);

        console.log('✨ 小窗口已支持全屏和最小化到任务栏');
        console.log(`📁 共 ${Object.keys(CATEGORIES).length} 个分类，${LINK_DATA.length} 个链接`);
    </script>
</body>
</html>
