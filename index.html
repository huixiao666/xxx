<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebOS · 网页桌面</title>
<style>
:root{
  --taskbar-h:52px; --accent:#4c8dff;
  --panel:rgba(26,26,33,.92); --panel-solid:#1b1b22;
  --text:#e8e9ef; --text-dim:#9aa0ae; --line:rgba(255,255,255,.10);
  --hover:rgba(255,255,255,.09); --titlebar:#23232c; --body:#1b1b22;
}
body[data-theme="light"]{
  --panel:rgba(252,252,255,.94); --panel-solid:#ffffff; --text:#16161d;
  --text-dim:#6b7280; --line:rgba(0,0,0,.10); --hover:rgba(0,0,0,.06);
  --titlebar:#f2f3f7; --body:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px;background:#111;color:var(--text);
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,textarea{font-family:inherit;color:inherit}
textarea,input{user-select:text;-webkit-user-select:text}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(128,128,140,.45);border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(128,128,140,.7);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* 启动屏 */
#boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#0d0d14;color:#fff;transition:opacity .5s ease}
#boot.hide{opacity:0;pointer-events:none}
.boot-in{display:flex;flex-direction:column;align-items:center;gap:20px}
.boot-logo{font-size:60px;animation:bootPulse 1.4s ease-in-out infinite}
@keyframes bootPulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.08);opacity:1}}
.boot-name{font-size:21px;font-weight:700;letter-spacing:.22em}
.boot-bar{width:190px;height:3px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.boot-bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;animation:bootLoad 1.5s ease forwards}
@keyframes bootLoad{to{width:100%}}

/* 桌面 */
#desktop{position:fixed;left:0;right:0;top:0;bottom:var(--taskbar-h);background:linear-gradient(135deg,#1e3c72,#2a5298 45%,#6a3093);overflow:hidden;transition:background .5s ease}
#windowsLayer{position:absolute;inset:0;pointer-events:none;z-index:50}
#selBox{position:absolute;display:none;z-index:40;pointer-events:none;border:1px solid rgba(120,170,255,.9);background:rgba(76,141,255,.22);border-radius:3px}
#snapPreview{position:absolute;display:none;z-index:45;pointer-events:none;border:2px solid rgba(120,170,255,.85);background:rgba(76,141,255,.18);border-radius:10px;transition:all .12s ease}

/* 图标 */
.desk-icon{position:absolute;width:92px;padding:8px 4px 6px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;text-align:center;font-size:12px;line-height:1.25;cursor:default;text-shadow:0 1px 4px rgba(0,0,0,.8);transition:background .12s;touch-action:none;z-index:2}
.desk-icon .ic{font-size:32px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.45));pointer-events:none;transition:transform .14s}
.desk-icon .ic-label{pointer-events:none;word-break:break-all;max-width:88px}
.desk-icon:hover{background:rgba(255,255,255,.14)}
.desk-icon:hover .ic{transform:scale(1.08)}
.desk-icon.selected{background:rgba(255,255,255,.28);outline:1px solid rgba(255,255,255,.55)}
.desk-icon.dragging{opacity:.6}

/* 窗口 */
.window{position:absolute;display:flex;flex-direction:column;min-width:300px;min-height:180px;background:var(--body);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 16px 44px rgba(0,0,0,.42);pointer-events:auto;will-change:transform,width,height}
.window.active{box-shadow:0 26px 66px rgba(0,0,0,.55);border-color:rgba(120,160,255,.4)}
.window.maximized{border-radius:0;border-color:transparent}
.window.opening{animation:winOpen .2s cubic-bezier(.2,.9,.3,1.2)}
@keyframes winOpen{from{opacity:0;transform:scale(.93) translateY(12px)}to{opacity:1;transform:none}}
.window.closing{animation:winClose .16s ease forwards;pointer-events:none}
@keyframes winClose{to{opacity:0;transform:scale(.94)}}
.window.minimizing{animation:winMin .18s ease forwards;pointer-events:none}
@keyframes winMin{to{opacity:0;transform:scale(.7) translateY(60px)}}
.titlebar{height:38px;flex:0 0 38px;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;background:var(--titlebar);border-bottom:1px solid var(--line);cursor:default;touch-action:none}
.tb-icon{font-size:15px;line-height:1}
.tb-title{flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-btns{display:flex;gap:2px}
.tb-btn{width:30px;height:26px;border-radius:6px;display:grid;place-items:center;font-size:12px;color:var(--text-dim);transition:.12s}
.tb-btn:hover{background:var(--hover);color:var(--text)}
.tb-btn.close:hover{background:#e81123;color:#fff}
.win-body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
.resizer{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;z-index:9}
.resizer::after{content:"";position:absolute;right:3px;bottom:3px;width:7px;height:7px;border-right:2px solid var(--text-dim);border-bottom:2px solid var(--text-dim);opacity:.45}

/* 任务栏 */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--taskbar-h);display:flex;align-items:center;gap:8px;padding:0 10px;z-index:1000;background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line)}
#startBtn{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:8px;font-size:14px;font-weight:600;transition:.12s;flex:0 0 auto}
#startBtn:hover,#startBtn.active{background:var(--hover)}
#startBtn .logo{font-size:17px;color:var(--accent);transition:transform .25s}
#startBtn.active .logo{transform:rotate(90deg)}
#taskItems{flex:1;display:flex;gap:6px;overflow:hidden;min-width:0}
.task-item{display:flex;align-items:center;gap:7px;height:38px;max-width:190px;padding:0 12px;border-radius:8px;font-size:12.5px;position:relative;transition:.12s;flex:0 0 auto}
.task-item:hover,.task-item.active{background:var(--hover)}
.task-item.active::after{content:"";position:absolute;left:12px;right:12px;bottom:1px;height:2px;border-radius:2px;background:var(--accent)}
.task-item.minimized{opacity:.55}
.ti-ic{font-size:14px;line-height:1}
.ti-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tray{display:flex;align-items:center;gap:4px;flex:0 0 auto;padding-right:2px}
.tray-btn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:14px;color:var(--text-dim);transition:.12s;position:relative}
.tray-btn:hover{background:var(--hover);color:var(--text)}
.tray-dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:#ff5d5d;display:none}
.tray-dot.show{display:block;animation:dotPulse 1.2s infinite}
@keyframes dotPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.6}}
#clock{font-size:12.5px;padding:7px 11px;border-radius:8px;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap;transition:.12s}
#clock:hover{background:var(--hover)}

/* 通知 */
#toasts{position:fixed;right:12px;bottom:calc(var(--taskbar-h) + 12px);z-index:1600;display:flex;flex-direction:column-reverse;gap:8px;pointer-events:none;max-height:calc(100vh - 120px)}
.toast{pointer-events:auto;display:flex;align-items:flex-start;gap:10px;width:320px;max-width:calc(100vw - 24px);padding:12px 12px 12px 14px;background:var(--panel);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:11px;box-shadow:0 14px 40px rgba(0,0,0,.4);animation:toastIn .26s cubic-bezier(.2,.9,.3,1.2)}
.toast.out{animation:toastOut .22s ease forwards}
.toast.warn{border-left-color:#f1c40f}
.toast.err{border-left-color:#ff5d5d}
.toast.ok{border-left-color:#2ecc71}
@keyframes toastIn{from{opacity:0;transform:translateX(60px) scale(.94)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(60px) scale(.94)}}
.toast-ic{font-size:19px;line-height:1.2}
.toast-body{flex:1;min-width:0}
.toast-body b{display:block;font-size:13px;margin-bottom:2px}
.toast-body span{font-size:12px;color:var(--text-dim);line-height:1.5;word-break:break-word}
.toast-x{width:22px;height:22px;border-radius:6px;color:var(--text-dim);font-size:11px;flex:0 0 auto}
.toast-x:hover{background:var(--hover);color:var(--text)}

/* 开始菜单 */
#startMenu{position:fixed;left:10px;bottom:calc(var(--taskbar-h) + 10px);width:430px;max-width:calc(100vw - 20px);max-height:min(580px,calc(100vh - 90px));padding:16px;display:none;flex-direction:column;gap:12px;z-index:1200;background:var(--panel);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 64px rgba(0,0,0,.5)}
#startMenu.show{display:flex;animation:popIn .18s ease}
@keyframes popIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
#startSearch{width:100%;height:38px;padding:0 14px;border-radius:9px;background:var(--hover);border:1px solid transparent;outline:none;font-size:13.5px}
#startSearch:focus{border-color:var(--accent)}
.start-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;overflow:auto;padding:2px}
.start-app{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 4px;border-radius:10px;font-size:12px;transition:.12s;outline:none}
.start-app:hover,.start-app:focus{background:var(--hover)}
.start-app .ic{font-size:30px;line-height:1}
.start-foot{font-size:11px;color:var(--text-dim);text-align:center;padding-top:8px;border-top:1px solid var(--line)}

/* 菜单与弹层 */
.menu{position:fixed;display:none;flex-direction:column;min-width:190px;padding:6px;z-index:1500;background:var(--panel);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 44px rgba(0,0,0,.45)}
.menu.show{display:flex;animation:popIn .12s ease}
.menu-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:7px;font-size:13px;text-align:left;transition:.1s}
.menu-item:hover{background:var(--accent);color:#fff}
.menu-item .mi-ic{width:18px;text-align:center;font-size:14px}
.menu-item .mi-key{margin-left:auto;font-size:10.5px;opacity:.55}
.menu-item.danger:hover{background:#e81123}
.menu-sep{height:1px;background:var(--line);margin:5px 8px}
.popover{position:fixed;right:10px;bottom:calc(var(--taskbar-h) + 10px);width:292px;padding:16px;display:none;z-index:1200;background:var(--panel);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:14px;box-shadow:0 22px 56px rgba(0,0,0,.48)}
.popover.show{display:block;animation:popIn .16s ease}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head b{font-size:15px}
.cal-head button{width:28px;height:28px;border-radius:7px;font-size:14px;color:var(--text-dim)}
.cal-head button:hover{background:var(--hover);color:var(--text)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:12px}
.cal-grid .wd{color:var(--text-dim);font-size:11px;padding:4px 0}
.cal-grid .d{padding:7px 0;border-radius:7px;cursor:default}
.cal-grid .d:hover{background:var(--hover)}
.cal-grid .d.today{background:var(--accent);color:#fff;font-weight:700}
.cal-grid .d.other{opacity:.28}
.cal-now{text-align:center;font-size:22px;font-weight:700;margin-top:12px;font-variant-numeric:tabular-nums}

/* 通知中心 */
#notifyCenter{position:fixed;right:10px;bottom:calc(var(--taskbar-h) + 10px);width:360px;max-width:calc(100vw - 20px);max-height:min(520px,calc(100vh - 90px));padding:14px;display:none;flex-direction:column;gap:10px;z-index:1400;background:var(--panel);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 64px rgba(0,0,0,.5)}
#notifyCenter.show{display:flex;animation:popIn .18s ease}
.nc-head{display:flex;align-items:center;justify-content:space-between}
.nc-head b{font-size:14px}
.nc-head button{font-size:11.5px;color:var(--text-dim);padding:5px 10px;border-radius:6px}
.nc-head button:hover{background:var(--hover);color:var(--text)}
.nc-list{overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:0}
.nc-item{padding:10px 12px;border-radius:9px;background:var(--hover);border-left:3px solid var(--accent);animation:popIn .16s ease}
.nc-item b{display:block;font-size:12.5px;margin-bottom:3px}
.nc-item span{font-size:11.5px;color:var(--text-dim);line-height:1.5;word-break:break-word}
.nc-item .tm{display:block;font-size:10.5px;color:var(--text-dim);opacity:.7;margin-top:5px}
.nc-empty{text-align:center;color:var(--text-dim);font-size:12px;padding:30px 0}

/* 应用 */
.app-notepad{display:flex;flex-direction:column;height:100%}
.np-bar{display:flex;align-items:center;gap:6px;padding:7px 9px;border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
.np-bar button{padding:5px 11px;border-radius:6px;font-size:12px;background:var(--hover);transition:.12s}
.np-bar button:hover{background:var(--accent);color:#fff}
.np-bar button.on{background:var(--accent);color:#fff}
.np-status{margin-left:auto;font-size:11px;color:var(--text-dim);white-space:nowrap}
.np-area{flex:1;position:relative;min-height:0}
.np-area textarea{width:100%;height:100%;resize:none;border:none;outline:none;padding:14px 16px;background:transparent;color:var(--text);font-size:14px;line-height:1.7;font-family:Consolas,"Courier New",monospace}
.np-find{position:absolute;top:8px;right:14px;display:none;gap:6px;padding:6px;background:var(--panel-solid);border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.np-find.show{display:flex}
.np-find input{width:150px;height:28px;padding:0 9px;border-radius:6px;background:var(--hover);border:1px solid transparent;outline:none;font-size:12.5px}
.np-find input:focus{border-color:var(--accent)}
.np-find button{padding:0 9px;height:28px;border-radius:6px;font-size:12px;background:var(--hover)}
.np-find button:hover{background:var(--accent);color:#fff}

.app-calc{display:flex;flex-direction:column;height:100%;padding:12px;gap:10px}
.calc-display{background:var(--hover);border-radius:9px;padding:12px 16px;min-height:78px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;overflow:hidden;flex:0 0 auto}
.calc-display .expr{font-size:12px;color:var(--text-dim);min-height:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calc-display .val{font-size:28px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calc-keys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;min-height:0}
.calc-keys button{border-radius:9px;background:var(--hover);font-size:16px;font-weight:500;transition:.1s;min-height:36px}
.calc-keys button:hover{filter:brightness(1.35)}
.calc-keys button:active{transform:scale(.96)}
.calc-keys button.fn{color:var(--accent)}
.calc-keys button.op{color:#ffa94d}
.calc-keys button.eq{background:var(--accent);color:#fff}

.app-fm{display:flex;flex-direction:column;height:100%}
.fm-bar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);flex:0 0 auto}
.fm-bar>button{width:30px;height:30px;border-radius:7px;font-size:15px;color:var(--text-dim);flex:0 0 auto}
.fm-bar>button:hover{background:var(--hover);color:var(--text)}
.fm-bar>button:disabled{opacity:.3;cursor:default}
.fm-bar>button:disabled:hover{background:none}
.fm-crumbs{display:flex;align-items:center;gap:2px;flex:1;overflow:auto;font-size:12.5px;scrollbar-width:none}
.fm-crumbs::-webkit-scrollbar{display:none}
.fm-crumbs span.cr{padding:4px 8px;border-radius:6px;cursor:pointer;white-space:nowrap}
.fm-crumbs span.cr:hover{background:var(--hover)}
.fm-crumbs span.sep{opacity:.4;cursor:default}
.fm-grid{flex:1;overflow:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px;align-content:start}
.fm-item{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 5px;border-radius:9px;font-size:12px;text-align:center;word-break:break-all;transition:.1s;outline:none}
.fm-item:hover{background:var(--hover)}
.fm-item.sel{background:rgba(76,141,255,.28);outline:1px solid var(--accent)}
.fm-item .ic{font-size:32px;line-height:1}
.fm-item input.fm-rename{width:88%;height:22px;padding:0 5px;border-radius:5px;font-size:12px;background:var(--panel-solid);border:1px solid var(--accent);outline:none;text-align:center}
.fm-empty{grid-column:1/-1;color:var(--text-dim);font-size:12.5px;padding:26px;text-align:center}

.app-term{height:100%;display:flex;flex-direction:column;padding:12px 14px;overflow:auto;background:#0b0b12;color:#cfd6e2;font-family:Consolas,"Courier New",monospace;font-size:13px}
.term-out{white-space:pre-wrap;word-break:break-word;line-height:1.55;flex:0 0 auto}
.term-line{display:flex;align-items:center;gap:7px;margin-top:6px;flex:0 0 auto}
.term-ps{color:#6ee7a0;white-space:nowrap}
.term-in{flex:1;background:transparent;border:none;outline:none;color:inherit;font:inherit;caret-color:#6ee7a0}
.term-err{color:#ff6b6b}
.term-ok{color:#6ee7a0}

.app-paint{display:flex;flex-direction:column;height:100%}
.paint-bar{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;flex:0 0 auto}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:.12s}
.swatch:hover{transform:scale(1.14)}
.swatch.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--panel-solid) inset}
.paint-bar input[type=range]{width:88px;accent-color:var(--accent)}
.paint-bar button{padding:5px 11px;border-radius:6px;font-size:12px;background:var(--hover);transition:.12s}
.paint-bar button:hover{background:var(--accent);color:#fff}
.paint-bar button.on{background:var(--accent);color:#fff}
.paint-canvas{flex:1;position:relative;overflow:hidden;background:#fff}
.paint-canvas canvas{display:block;cursor:crosshair;touch-action:none}

.app-snake{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;height:100%;padding:14px;background:linear-gradient(160deg,#12121c,#1a1a2a)}
.snake-hud{display:flex;gap:22px;font-size:13px;color:#cfd6e2;align-items:center;flex-wrap:wrap;justify-content:center}
.snake-hud b{color:#6ee7a0}
.snake-hud select{background:#22222f;color:#cfd6e2;border:1px solid #33334a;border-radius:6px;padding:3px 7px;font-size:12px;outline:none}
.snake-wrap{position:relative;border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.snake-wrap canvas{display:block}
.snake-over{position:absolute;inset:0;display:none;place-items:center;text-align:center;background:rgba(6,6,12,.78);color:#fff;font-size:17px;font-weight:700;line-height:1.9}
.snake-over.show{display:grid}
.snake-over small{display:block;font-size:12px;font-weight:400;opacity:.75;margin-top:6px}

.app-todo{display:flex;flex-direction:column;height:100%;padding:16px;gap:12px}
.todo-head{display:flex;gap:8px}
.todo-head input{flex:1;height:40px;padding:0 14px;border-radius:9px;background:var(--hover);border:1px solid transparent;outline:none;font-size:13.5px}
.todo-head input:focus{border-color:var(--accent)}
.todo-head button{padding:0 18px;border-radius:9px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;transition:.12s}
.todo-head button:hover{filter:brightness(1.12)}
.todo-stat{font-size:12px;color:var(--text-dim);display:flex;justify-content:space-between;align-items:center}
.todo-stat button{font-size:11.5px;color:var(--text-dim);padding:4px 9px;border-radius:6px}
.todo-stat button:hover{background:var(--hover);color:var(--text)}
.todo-list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;padding-right:4px}

      <button class="tray-btn" id="themeBtn" title="切换主题">🌙</button>

  <div id="notifyCenter"></div>
  <div id="toasts"></div>

<script>
/* ============================================================
   0. Cache —— 统一本地缓存层
   ------------------------------------------------------------
   · 统一前缀 webos::
   · 版本化包装 { v, t, d }，便于未来迁移
   · 自动处理配额溢出（LRU 清理 30%）
   · 跨标签页同步（storage 事件 + BroadcastChannel）
   · 导出 / 导入 / 统计 / 逐项清理
   ============================================================ */
const Cache = (() => {
  const PREFIX = 'webos::';
  const VERSION = 2;
  const MIGRATION_KEY = '_migrated';

  const mem = new Map();               // 内存二级缓存
  const listeners = new Map();         // 事件订阅

  function _emit(key, val) {
    (listeners.get(key) || []).forEach(fn => { try { fn(val); } catch(e){} });
    (listeners.get('*') || []).forEach(fn => { try { fn(key, val); } catch(e){} });
  }

  function _key(k) { return PREFIX + k; }

  function set(k, v) {
    let payload;
    try { payload = JSON.stringify({ v: VERSION, t: Date.now(), d: v }); }
    catch(e) { return { ok: false, error: '序列化失败' }; }

    try {
      localStorage.setItem(_key(k), payload);
      mem.set(k, v);
      _emit(k, v);
      _postSync({ type: 'set', key: k });
      return { ok: true, size: payload.length };
    } catch (e) {
      if (e && (e.name === 'QuotaExceededError' || e.code === 22)) {
        const freed = _evictLRU();
        try {
          localStorage.setItem(_key(k), payload);
          mem.set(k, v);
          _emit(k, v);
          _postSync({ type: 'set', key: k });
          return { ok: true, size: payload.length, evicted: freed };
        } catch (e2) {
          return { ok: false, error: '存储空间已满，清理后仍无法写入' };
        }
      }
      return { ok: false, error: e.message || '未知错误' };
    }
  }

  function get(k, def) {
    if (mem.has(k)) return mem.get(k);
    try {
      const raw = localStorage.getItem(_key(k));
      if (raw === null) return def;
      let p;
      try { p = JSON.parse(raw); }
      catch(e) {
        // 兼容旧版本纯文本格式
        mem.set(k, raw);
        return raw;
      }
      // 新版包装格式
      if (p && typeof p === 'object' && 'v' in p && 'd' in p) {
        const v = _migrate(p.v, p.d);
        mem.set(k, v);
        return v;
      }
      // 旧版裸数据
      mem.set(k, p);
      return p;
    } catch (e) { return def; }
  }

  function del(k) {
    try {
      localStorage.removeItem(_key(k));
      mem.delete(k);
      _emit(k, undefined);
      _postSync({ type: 'del', key: k });
      return true;
    } catch (e) { return false; }
  }

  function has(k) {
    if (mem.has(k)) return true;
    try { return localStorage.getItem(_key(k)) !== null; } catch (e) { return false; }
  }

  function keys() {
    const out = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(PREFIX)) out.push(k.slice(PREFIX.length));
      }
    } catch(e) {}
    return out;
  }

  function clear() {
    keys().forEach(del);
    mem.clear();
  }

  /* 单项大小（字节，近似 UTF-16） */
  function sizeOf(k) {
    try {
      const raw = localStorage.getItem(_key(k));
      return raw ? raw.length * 2 : 0;
    } catch(e) { return 0; }
  }

  /* 总体积统计 */
  function stats() {
    const items = keys().map(k => ({ key: k, bytes: sizeOf(k) }));
    items.sort((a, b) => b.bytes - a.bytes);
    const total = items.reduce((s, x) => s + x.bytes, 0);
    return {
      total,
      pretty: prettyBytes(total),
      count: items.length,
      items,
      quotaPct: Math.min(100, (total / (5 * 1024 * 1024)) * 100)
    };
  }

  /* 删除最近最少更新的数据以腾出空间 */
  function _evictLRU() {
    const items = keys().map(k => {
      let t = 0;
      try {
        const p = JSON.parse(localStorage.getItem(_key(k)));
        if (p && typeof p === 'object' && p.t) t = p.t;
      } catch(e) {}
      return { k, t };
    }).sort((a, b) => a.t - b.t);

    const n = Math.max(1, Math.floor(items.length * 0.3));
    let freed = 0;
    for (let i = 0; i < n; i++) {
      freed += sizeOf(items[i].k);
      del(items[i].k);
    }
    return freed;
  }

  /* 旧数据版本迁移入口 */
  function _migrate(fromV, data) {
    let d = data;
    if (fromV < 2) {
      // v1 → v2：旧版没有嵌套结构；这里保留兼容
      d = data;
    }
    return d;
  }

  /* 首次启动时的版本标记 */
  function checkVersion() {
    const last = get(MIGRATION_KEY, 0);
    if (last !== VERSION) {
      set(MIGRATION_KEY, VERSION);
      return { migrated: true, from: last, to: VERSION };
    }
    return { migrated: false, to: VERSION };
  }

  /* 备份 / 恢复 */
  function exportAll() {
    const data = {};
    keys().forEach(k => { data[k] = get(k); });
    return {
      app: 'WebOS',
      version: VERSION,
      exportedAt: new Date().toISOString(),
      userAgent: navigator.userAgent,
      data
    };
  }

  function importAll(json, opts) {
    opts = opts || {};
    if (!json || typeof json !== 'object' || !json.data || typeof json.data !== 'object') {
      throw new Error('文件格式不正确');
    }
    if (opts.clearFirst) clear();
    let okCount = 0, failCount = 0;
    Object.entries(json.data).forEach(([k, v]) => {
      const r = set(k, v);
      if (r.ok) okCount++; else failCount++;
    });
    return { okCount, failCount };
  }

  /* 订阅变化 */
  function onChange(key, fn) {
    if (!listeners.has(key)) listeners.set(key, []);
    listeners.get(key).push(fn);
    return () => {
      const arr = listeners.get(key) || [];
      const i = arr.indexOf(fn);
      if (i >= 0) arr.splice(i, 1);
    };
  }

  /* 跨标签页同步 */
  let _bc = null;
  try {
    if ('BroadcastChannel' in window) {
      _bc = new BroadcastChannel('webos-sync');
      _bc.onmessage = e => {
        const msg = e.data;
        if (msg && msg.type) {
          mem.delete(msg.key);
          if (msg.type === 'set') {
            const v = get(msg.key, undefined);
            _emit(msg.key, v);
          } else if (msg.type === 'del') {
            _emit(msg.key, undefined);
          }
        }
      };
    }
  } catch(e) {}

  function _postSync(msg) {
    if (_bc) { try { _bc.postMessage(msg); } catch(e) {} }
  }

  window.addEventListener('storage', e => {
    if (!e.key || !e.key.startsWith(PREFIX)) return;
    const k = e.key.slice(PREFIX.length);
    mem.delete(k);
    if (e.newValue === null) _emit(k, undefined);
    else {
      const v = get(k, undefined);
      _emit(k, v);
    }
  });

  function prettyBytes(b) {
    if (b < 1024) return b + ' B';
    if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
    return (b / 1024 / 1024).toFixed(2) + ' MB';
  }

  return { set, get, del, has, keys, clear, sizeOf, stats, exportAll, importAll, onChange, checkVersion, prettyBytes, PREFIX, VERSION };
})();

/* 向后兼容：旧的 store 接口 */
const store = {
  get: (k, d) => Cache.get(k, d),
  set: (k, v) => Cache.set(k, v)
};

/* ============================================================
   1. 基础工具
   ============================================================ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.prototype.slice.call(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = n => String(n).padStart(2, '0');

const desktop   = $('#desktop');
const winLayer  = $('#windowsLayer');
const taskItems = $('#taskItems');
const startMenu = $('#startMenu');
const ctxMenu   = $('#contextMenu');
const calPop    = $('#calendarPop');
const toasts    = $('#toasts');
const snapPrev  = $('#snapPreview');
const selBox    = $('#selBox');
const notifyCenter = $('#notifyCenter');

/* ============================================================
   2. 通知系统（含持久化历史）
   ============================================================ */
const NOTIFY_MAX = 40;
let notifyHistory = Cache.get('notifyHistory', []);

function updateNotifyDot() {
  const dot = $('#notifyBtn .tray-dot');
  const unread = notifyHistory.filter(n => !n.read).length;
  if (dot) dot.classList.toggle('show', unread > 0);
}

function notify(title, msg, icon, opts) {
  opts = opts || {};
  const type = opts.type || 'info'; // info | ok | warn | err

  /* 历史记录 */
  const item = {
    id: Date.now() + Math.random(),
    title, msg: msg || '', icon: icon || '🔔',
    type, time: Date.now(), read: false
  };
  notifyHistory.unshift(item);
  if (notifyHistory.length > NOTIFY_MAX) notifyHistory.length = NOTIFY_MAX;
  Cache.set('notifyHistory', notifyHistory);
  updateNotifyDot();

  /* 桌面弹层 */
  const el = document.createElement('div');
  el.className = 'toast' + (type !== 'info' ? ' ' + type : '');
  el.innerHTML =
    '<span class="toast-ic">' + (icon || '🔔') + '</span>' +
    '<div class="toast-body"><b>' + esc(title) + '</b>' +
      (msg ? '<span>' + esc(msg) + '</span>' : '') + '</div>' +
    '<button class="toast-x">✕</button>';

  const kill = () => {
    if (el.classList.contains('out')) return;
    el.classList.add('out');
    setTimeout(() => el.remove(), 240);
  };
  el.querySelector('.toast-x').addEventListener('click', kill);
  el.addEventListener('click', e => {
    if (e.target.closest('.toast-x')) return;
    openNotifyCenter();
    kill();
  });
  toasts.appendChild(el);

  const all = $$('.toast', toasts);
  if (all.length > 4) all[0].querySelector('.toast-x').click();

  setTimeout(kill, opts.duration || 4200);

  /* 可选声音反馈 */
  if (opts.sound) beep(type);
}

/* 简易提示音 */
function beep(type) {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = type === 'err' ? 260 : (type === 'warn' ? 420 : 660);
    g.gain.setValueAtTime(0.04, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.14);
    o.start(); o.stop(ctx.currentTime + 0.14);
    setTimeout(() => ctx.close(), 300);
  } catch(e) {}
}

function renderNotifyCenter() {
  if (!notifyHistory.length) {
    notifyCenter.innerHTML =
      '<div class="nc-head"><b>通知中心</b><button class="nc-clear">全部已读</button></div>' +
      '<div class="nc-list"><div class="nc-empty">🔔 暂无通知</div></div>';
    return;
  }
  let html = '<div class="nc-head"><b>通知中心</b><button class="nc-clear">全部已读</button></div><div class="nc-list">';
  notifyHistory.slice(0, 20).forEach(n => {
    const ago = timeAgo(n.time);
    html +=
      '<div class="nc-item" style="border-left-color:' +
        (n.type === 'err' ? '#ff5d5d' : n.type === 'warn' ? '#f1c40f' : n.type === 'ok' ? '#2ecc71' : 'var(--accent)') +
        '">' +
      '<b>' + (n.icon || '🔔') + ' ' + esc(n.title) + '</b>' +
      (n.msg ? '<span>' + esc(n.msg) + '</span>' : '') +
      '<span class="tm">' + ago + '</span></div>';
  });
  html += '</div>';
  notifyCenter.innerHTML = html;

  notifyCenter.querySelector('.nc-clear').addEventListener('click', () => {
    notifyHistory.forEach(n => n.read = true);
    Cache.set('notifyHistory', notifyHistory);
    updateNotifyDot();
    notifyCenter.classList.remove('show');
  });
}

function openNotifyCenter() {
  const showing = notifyCenter.classList.contains('show');
  calPop.classList.remove('show');
  if (showing) { notifyCenter.classList.remove('show'); return; }
  notifyHistory.forEach(n => n.read = true);
  Cache.set('notifyHistory', notifyHistory);
  updateNotifyDot();
  renderNotifyCenter();
  notifyCenter.classList.add('show');
}

function timeAgo(t) {
  const s = Math.floor((Date.now() - t) / 1000);
  if (s < 60) return '刚刚';
  if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
  if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
  return Math.floor(s / 86400) + ' 天前';
}

updateNotifyDot();

  clearTimeout(fsSaveTimer);

    if (!r.ok) notify('文件管理器', '保存失败：' + r.error, '⚠️', { type: 'err' });

function fsResolve(path) {
  let node = FS;
  for (let i = 0; i < path.length; i++) {
    if (!node.children || !node.children[path[i]]) return null;
    node = node.children[path[i]];
  }
  return node;
}

/* ============================================================
   5. 窗口管理
   ============================================================ */
let zTop = 100;
let uid = 0;
const wins = new Map();
let snapSide = null;

function findWin(appId) {
  for (const w of wins.values()) if (w.appId === appId) return w;
  return null;
}

function createWindow(opts) {
  if (opts.appId && opts.appId !== 'term') {
    const ex = findWin(opts.appId);
    if (ex) { restoreWin(ex); focusWin(ex); return ex; }
  }

  const id = 'w' + (++uid);
  const el = document.createElement('div');
  el.className = 'window';
  el.dataset.id = id;

  const dw = desktop.clientWidth, dh = desktop.clientHeight;
  const W = Math.max(300, Math.min(opts.width || 680, dw - 24));
  const H = Math.max(180, Math.min(opts.height || 460, dh - 24));
  const off = (wins.size % 7) * 28;
  const x = Math.max(8, Math.min(90 + off, Math.max(8, dw - W - 10)));
  const y = Math.max(8, Math.min(48 + off, Math.max(8, dh - H - 10)));
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.width = W + 'px';
  el.style.height = H + 'px';

  el.innerHTML =
    '<div class="titlebar">' +
      '<span class="tb-icon">' + (opts.icon || '🪟') + '</span>' +
      '<span class="tb-title">' + esc(opts.title || '窗口') + '</span>' +
      '<div class="tb-btns">' +
        '<button class="tb-btn" data-act="min" title="最小化">—</button>' +
        '<button class="tb-btn" data-act="max" title="最大化">▢</button>' +
        '<button class="tb-btn close" data-act="close" title="关闭">✕</button>' +
      '</div>' +
    '</div>' +
    '<div class="win-body"></div>' +
    '<div class="resizer"></div>';

  const body = el.querySelector('.win-body');
  if (opts.content) {
    if (typeof opts.content === 'string') body.innerHTML = opts.content;
    else body.appendChild(opts.content);
  }
  winLayer.appendChild(el);
  el.classList.add('opening');
  el.addEventListener('animationend', () => el.classList.remove('opening'), { once: true });

  const win = {
    id, el, body,
    appId: opts.appId || id,
    title: opts.title || '窗口',
    icon: opts.icon || '🪟',
    minimized: false, maximized: false,
    snap: null, restore: null, api: {}
  };
  wins.set(id, win);

  el.querySelector('.tb-btns').addEventListener('click', e => {
    const b = e.target.closest('.tb-btn');
    if (!b) return;
    const act = b.dataset.act;
    if (act === 'min') minWin(win);
    else if (act === 'max') maxWin(win);
    else if (act === 'close') closeWin(win);
  });

  const tb = el.querySelector('.titlebar');
  tb.addEventListener('dblclick', e => { if (!e.target.closest('.tb-btn')) maxWin(win); });

  tb.addEventListener('pointerdown', e => {
    if (e.target.closest('.tb-btn') || e.button !== 0) return;
    focusWin(win);

    let ox = el.offsetLeft, oy = el.offsetTop;
    if (win.maximized || win.snap) {
      const r = win.restore || { left: '60px', top: '40px', width: W + 'px', height: H + 'px' };
      el.classList.remove('maximized');
      el.style.left = r.left; el.style.top = r.top;
      el.style.width = r.width; el.style.height = r.height;
      win.maximized = false; win.snap = null;
      ox = el.offsetLeft; oy = el.offsetTop;
      if (win.api.onResize) win.api.onResize();
    }

    const sx = e.clientX, sy = e.clientY;
    let raf = null, px = ox, py = oy;

    const move = ev => {
      px = ox + ev.clientX - sx;
      py = oy + ev.clientY - sy;
      if (!raf) raf = requestAnimationFrame(() => {
        raf = null;
        const mx = desktop.clientWidth - el.offsetWidth;
        const my = desktop.clientHeight - el.offsetHeight;
        el.style.left = Math.max(0, Math.min(px, mx)) + 'px';
        el.style.top = Math.max(0, Math.min(py, my)) + 'px';
      });

      const dw2 = desktop.clientWidth, dh2 = desktop.clientHeight;
      let side = null;
      if (ev.clientX <= 14) side = 'left';
      else if (ev.clientX >= dw2 - 14) side = 'right';
      else if (ev.clientY <= 6) side = 'max';

      if (side !== snapSide) {
        snapSide = side;
        if (!side) snapPrev.style.display = 'none';
        else {
          snapPrev.style.display = 'block';
          if (side === 'left') Object.assign(snapPrev.style, { left: '6px', top: '6px', width: (dw2 / 2 - 9) + 'px', height: (dh2 - 12) + 'px' });
          else if (side === 'right') Object.assign(snapPrev.style, { left: (dw2 / 2 + 3) + 'px', top: '6px', width: (dw2 / 2 - 9) + 'px', height: (dh2 - 12) + 'px' });
          else Object.assign(snapPrev.style, { left: '6px', top: '6px', width: (dw2 - 12) + 'px', height: (dh2 - 12) + 'px' });
        }
      }
    };

    const up = () => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      if (raf) cancelAnimationFrame(raf);
      if (snapSide) {
        const r = { left: el.style.left, top: el.style.top, width: el.style.width, height: el.style.height };
        if (!win.restore) win.restore = r;
        const dw2 = desktop.clientWidth, dh2 = desktop.clientHeight;
        if (snapSide === 'left') {
          el.style.left = '6px'; el.style.top = '6px';
          el.style.width = (dw2 / 2 - 9) + 'px'; el.style.height = (dh2 - 12) + 'px';
          win.snap = 'left';
        } else if (snapSide === 'right') {
          el.style.left = (dw2 / 2 + 3) + 'px'; el.style.top = '6px';
          el.style.width = (dw2 / 2 - 9) + 'px'; el.style.height = (dh2 - 12) + 'px';
          win.snap = 'right';
        } else maxWin(win);
        if (win.api.onResize) setTimeout(win.api.onResize, 30);
      }
      snapSide = null;
      snapPrev.style.display = 'none';
    };

    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  });

  el.querySelector('.resizer').addEventListener('pointerdown', e => {
    e.stopPropagation();
    if (win.maximized) return;
    focusWin(win);
    const sx = e.clientX, sy = e.clientY;
    const ow = el.offsetWidth, oh = el.offsetHeight;
    let raf = null, nw = ow, nh = oh;
    const move = ev => {
      nw = Math.max(300, ow + ev.clientX - sx);
      nh = Math.max(180, oh + ev.clientY - sy);
      if (!raf) raf = requestAnimationFrame(() => {
        raf = null;
        el.style.width = nw + 'px';
        el.style.height = nh + 'px';
        if (win.api.onResize) win.api.onResize();
      });
    };
    const up = () => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      if (raf) cancelAnimationFrame(raf);
      win.snap = null;
      if (win.api.onResize) win.api.onResize();
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  });

  el.addEventListener('pointerdown', () => focusWin(win), true);

  const ti = document.createElement('button');
  ti.className = 'task-item';
  ti.title = win.title;
  ti.innerHTML = '<span class="ti-ic">' + win.icon + '</span><span class="ti-label">' + esc(win.title) + '</span>';
  ti.addEventListener('click', () => {
    if (win.minimized) { restoreWin(win); focusWin(win); }
    else if (el.classList.contains('active')) minWin(win);
    else focusWin(win);
  });
  win.taskEl = ti;
  taskItems.appendChild(ti);

  focusWin(win);
  return win;
}

function focusWin(win) {
  wins.forEach(w => {
    w.el.classList.remove('active');
    if (w.taskEl) w.taskEl.classList.remove('active');
  });
  win.el.classList.add('active');
  if (win.taskEl) win.taskEl.classList.add('active');
  win.el.style.zIndex = ++zTop;
}

function minWin(win) {
  if (win.minimized) return;
  win.minimized = true;
  win.el.classList.add('minimizing');
  setTimeout(() => {
    win.el.style.display = 'none';
    win.el.classList.remove('minimizing');
  }, 170);
  if (win.taskEl) {
    win.taskEl.classList.remove('active');
    win.taskEl.classList.add('minimized');
  }
}

function restoreWin(win) {
  win.minimized = false;
  win.el.style.display = '';
  win.el.classList.add('opening');
  win.el.addEventListener('animationend', () => win.el.classList.remove('opening'), { once: true });
  if (win.taskEl) win.taskEl.classList.remove('minimized');
}

function closeWin(win) {
  if (win.api && win.api.onClose) { try { win.api.onClose(); } catch (e) {} }
  if (win.taskEl) win.taskEl.remove();
  wins.delete(win.id);
  win.el.classList.add('closing');
  setTimeout(() => win.el.remove(), 180);
  let top = null;
  wins.forEach(w => { if (!w.minimized && (!top || +w.el.style.zIndex > +top.el.style.zIndex)) top = w; });
  if (top) focusWin(top);
}

function maxWin(win) {
  if (win.maximized) {
    win.maximized = false;
    win.el.classList.remove('maximized');
    const r = win.restore || { left: '60px', top: '40px', width: '680px', height: '460px' };
    win.el.style.left = r.left; win.el.style.top = r.top;
    win.el.style.width = r.width; win.el.style.height = r.height;
  } else {
    win.restore = {
      left: win.el.style.left, top: win.el.style.top,
      width: win.el.style.width, height: win.el.style.height
    };
    win.maximized = true; win.snap = null;
    win.el.classList.add('maximized');
    win.el.style.left = '0px'; win.el.style.top = '0px';
    win.el.style.width = '100%'; win.el.style.height = '100%';
  }
  if (win.api.onResize) setTimeout(win.api.onResize, 30);
}

function cycleWindows() {
  const list = [];
  wins.forEach(w => { if (!w.minimized) list.push(w); });
  if (list.length < 2) return;
  list.sort((a, b) => (+a.el.style.zIndex) - (+b.el.style.zIndex));
  const bottom = list[0];
  restoreWin(bottom);
  focusWin(bottom);
}

/* ============================================================
   6. 应用：记事本
   ============================================================ */
function openNotepad(opts) {
  opts = opts || {};
  const ex = findWin('notepad');
  if (ex) {
    restoreWin(ex); focusWin(ex);
    if (opts.content !== undefined) ex.api.setText(opts.content, opts.name, opts.path);
    return ex;
  }

  const root = document.createElement('div');
  root.className = 'app-notepad';
  root.innerHTML =
    '<div class="np-bar">' +
      '<button data-a="new">新建</button>' +
      '<button data-a="save">保存</button>' +
      '<button data-a="dl">下载</button>' +
      '<button data-a="find">查找</button>' +
      '<span class="np-status">就绪</span>' +
    '</div>' +
    '<div class="np-area">' +
      '<textarea spellcheck="false" placeholder="在此输入内容…"></textarea>' +
      '<div class="np-find">' +
        '<input placeholder="查找内容…" spellcheck="false">' +
        '<button data-f="next">下一个</button>' +
        '<button data-f="close">✕</button>' +
      '</div>' +
    '</div>';

  const ta = root.querySelector('textarea');
  const st = root.querySelector('.np-status');
  const findBox = root.querySelector('.np-find');
  const findInput = findBox.querySelector('input');

  let filePath = opts.path || null;
  /* 优先使用文件系统内容，其次草稿 */
  ta.value = opts.content !== undefined ? opts.content : Cache.get('notepad.draft', '');

  const win = createWindow({
    appId: 'notepad', title: opts.name || '记事本', icon: '📝',
    width: 660, height: 480, content: root
  });
  if (opts.name) win.el.querySelector('.tb-title').textContent = opts.name;

  function status(txt) { st.textContent = txt; }

  function updateCount() {
    const v = ta.value;
    status(v.length + ' 字符 · ' + v.split('\n').length + ' 行');
  }
  updateCount();

  let saveTimer = null;
  function persist() {
    if (filePath) {
      const node = fsResolve(filePath.slice(0, -1));
      const name = filePath[filePath.length - 1];
      if (node && node.children && node.children[name]) {
        node.children[name].content = ta.value;
        fsSave();
      }
    }
    Cache.set('notepad.draft', ta.value);
  }

  ta.addEventListener('input', () => {
    updateCount();
    status('编辑中…');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      persist();
      status('已自动保存 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false }));
    }, 700);
  });

  root.querySelector('.np-bar').addEventListener('click', e => {
    const a = e.target.dataset.a;
    if (!a) return;
    if (a === 'new') {
      ta.value = ''; filePath = null;
      win.el.querySelector('.tb-title').textContent = '记事本';
      updateCount(); status('已新建'); persist();
    } else if (a === 'save') {
      persist();
      status('已保存 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false }));
      notify('记事本', '内容已保存到本地', '💾', { type: 'ok' });
    } else if (a === 'dl') {
      const blob = new Blob([ta.value], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a2 = document.createElement('a');
      a2.href = url;
      a2.download = (win.el.querySelector('.tb-title').textContent || 'note').replace(/\.txt$/i, '') + '.txt';
      document.body.appendChild(a2); a2.click(); a2.remove();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
      status('已下载');
    } else if (a === 'find') {
      findBox.classList.toggle('show');
      if (findBox.classList.contains('show')) { findInput.focus(); findInput.select(); }
    }
  });

  function findNext() {
    const q = findInput.value;
    if (!q) return;
    const val = ta.value;
    const start = ta.selectionEnd || 0;
    let idx = val.indexOf(q, start);
    if (idx === -1) idx = val.indexOf(q, 0);
    if (idx === -1) { status('未找到「' + q + '」'); return; }
    ta.focus();
    ta.setSelectionRange(idx, idx + q.length);
    status('已定位到第 ' + (val.slice(0, idx).split('\n').length) + ' 行');
  }
  findBox.addEventListener('click', e => {
    const f = e.target.dataset.f;
    if (f === 'next') findNext();
    else if (f === 'close') { findBox.classList.remove('show'); ta.focus(); }
  });
  findInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); findNext(); }
    if (e.key === 'Escape') { findBox.classList.remove('show'); ta.focus(); }
  });

  ta.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); persist(); status('已保存'); }
    if ((e.ctrlKey || e.metaKey) && e.key === 'f') { e.preventDefault(); findBox.classList.add('show'); findInput.focus(); }
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = ta.selectionStart, en = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + '  ' + ta.value.slice(en);
      ta.selectionStart = ta.selectionEnd = s + 2;
      updateCount();
    }
  });

  win.api.setText = (t, name, path) => {
    ta.value = t;
    if (path) filePath = path;
    if (name) win.el.querySelector('.tb-title').textContent = name;
    updateCount(); status('已载入');
  };
  win.api.getText = () => ta.value;
  win.api.getState = () => ({ filePath, name: win.el.querySelector('.tb-title').textContent });
  return win;
}

/* ============================================================
   7. 应用：计算器
   ============================================================ */
function openCalc() {
  const ex = findWin('calc');
  if (ex) { restoreWin(ex); focusWin(ex); return ex; }

  const keys = [
    ['C', 'fn'], ['⌫', 'fn'], ['%', 'fn'], ['÷', 'op'],
    ['7', ''], ['8', ''], ['9', ''], ['×', 'op'],
    ['4', ''], ['5', ''], ['6', ''], ['−', 'op'],
    ['1', ''], ['2', ''], ['3', ''], ['+', 'op'],
    ['±', 'fn'], ['0', ''], ['.', ''], ['=', 'eq']
  ];

  const root = document.createElement('div');
  root.className = 'app-calc';
  root.innerHTML =
    '<div class="calc-display"><div class="expr"></div><div class="val">0</div></div>' +
    '<div class="calc-keys">' +
      keys.map(k => '<button class="' + k[1] + '" data-k="' + k[0] + '">' + k[0] + '</button>').join('') +
    '</div>';

  const exprEl = root.querySelector('.expr');
  const valEl = root.querySelector('.val');
  let expr = Cache.get('calc.expr', ''), done = false;

  function update() {
    exprEl.textContent = expr;
    valEl.textContent = expr === '' ? '0' : expr;
    Cache.set('calc.expr', expr);
  }
  update();

  function evaluate(str) {
    const s = str.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
    if (!/^[0-9+\-*/().\s]*$/.test(s) || s.trim() === '') throw new Error('bad');
    const v = Function('"use strict";return (' + s + ')')();
    if (typeof v !== 'number' || !isFinite(v)) throw new Error('bad');
    return Math.round(v * 1e12) / 1e12;
  }

  function press(k) {
    if (k === 'C') { expr = ''; done = false; update(); return; }
    if (k === '⌫') { expr = expr.slice(0, -1); done = false; update(); return; }
    if (k === '%') {
      try { expr = String(evaluate(expr) / 100); done = false; update(); }
      catch (e) { valEl.textContent = '错误'; }
      return;
    }
    if (k === '±') { expr = expr.startsWith('-') ? expr.slice(1) : '-' + expr; update(); return; }
    if (k === '=') {
      try {
        const v = evaluate(expr);
        exprEl.textContent = expr + ' =';
        valEl.textContent = String(v);
        expr = String(v); done = true;
        Cache.set('calc.history', (Cache.get('calc.history', []).concat(exprEl.textContent)).slice(-20));
      } catch (e) { valEl.textContent = '错误'; }
      return;
    }
    if (done && /[0-9.]/.test(k)) { expr = ''; done = false; }
    else if (done) { done = false; exprEl.textContent = ''; }
    expr += k;
    update();
  }

  root.querySelector('.calc-keys').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) press(b.dataset.k);
  });

  const win = createWindow({
    appId: 'calc', title: '计算器', icon: '🧮',
    width: 320, height: 470, content: root
  });

  function onKey(e) {
    if (!win.el.classList.contains('active') || win.minimized) return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    const map = { '/': '÷', '*': '×', '-': '−', '+': '+', 'Enter': '=', '=': '=', 'Backspace': '⌫', 'Escape': 'C', '%': '%' };
    if (/^[0-9.]$/.test(e.key)) { e.preventDefault(); press(e.key); return; }
    if (map[e.key]) { e.preventDefault(); press(map[e.key]); }
  }
  document.addEventListener('keydown', onKey);
  win.api.onClose = () => document.removeEventListener('keydown', onKey);
  return win;
}

/* ============================================================
   8. 应用：文件管理器
   ============================================================ */
function openFiles(startPath) {
  startPath = startPath || [];
  const ex = findWin('files');
  if (ex) {
    restoreWin(ex); focusWin(ex);
    ex.api.nav(startPath.length ? startPath : ex.api.path());
    return ex;
  }

  const root = document.createElement('div');
  root.className = 'app-fm';
  root.innerHTML =
    '<div class="fm-bar">' +
      '<button class="fm-up" title="上级目录">↑</button>' +
      '<div class="fm-crumbs"></div>' +
      '<button class="fm-newdir" title="新建文件夹">📁＋</button>' +
      '<button class="fm-newfile" title="新建文本">📄＋</button>' +
      '<button class="fm-refresh" title="刷新">⟳</button>' +
    '</div>' +
    '<div class="fm-grid"></div>';

  const crumbs = root.querySelector('.fm-crumbs');
  const grid = root.querySelector('.fm-grid');
  const upBtn = root.querySelector('.fm-up');

  let path = startPath.slice();
  let selected = null;

  function uniqName(dir, base, ext) {
    let name = base + ext, i = 1;
    while (dir.children[name]) { name = base + ' (' + i + ')' + ext; i++; }
    return name;
  }

  function render() {
    let node = fsResolve(path);
    if (!node) { path = []; node = FS; }
    selected = null;

    crumbs.innerHTML = '';
    const mkCrumb = (label, idx) => {
      const s = document.createElement('span');
      s.className = 'cr';
      s.textContent = label;
      s.addEventListener('click', () => { path = path.slice(0, idx); render(); });
      crumbs.appendChild(s);
    };
    mkCrumb('🏠 此电脑', 0);
    path.forEach((seg, i) => {
      const sep = document.createElement('span');
      sep.className = 'sep'; sep.textContent = '›';
      crumbs.appendChild(sep);
      mkCrumb(seg, i + 1);
    });

    grid.innerHTML = '';
    const entries = Object.keys(node.children || {}).map(k => [k, node.children[k]]);
    if (!entries.length) {
      const em = document.createElement('div');
      em.className = 'fm-empty';
      em.textContent = '📂 此文件夹为空 · 右键可新建';
      grid.appendChild(em);
    }
    entries.sort((a, b) => {
      if (a[1].type !== b[1].type) return a[1].type === 'dir' ? -1 : 1;
      return a[0].localeCompare(b[0], 'zh');
    });

    entries.forEach(([name, item]) => {
      const d = document.createElement('div');
      d.className = 'fm-item';
      d.tabIndex = 0;
      const icon = item.type === 'dir' ? '📁'
        : (/\.(txt|md|js|json|log)$/i.test(name) ? '📄'
        : (/\.(png|jpg|jpeg|gif|svg)$/i.test(name) ? '🖼️' : '📃'));
      d.innerHTML = '<div class="ic">' + icon + '</div><div class="nm">' + esc(name) + '</div>';

      const open = () => {
        if (item.type === 'dir') { path.push(name); render(); }
        else openNotepad({ content: item.content || '', name: name, path: path.concat(name) });
      };

      d.addEventListener('click', e => {
        e.stopPropagation();
        $$('.fm-item', grid).forEach(x => x.classList.remove('sel'));
        d.classList.add('sel');
        selected = name;
      });
      d.addEventListener('dblclick', e => { e.stopPropagation(); open(); });
      d.addEventListener('keydown', e => {
        if (e.key === 'Enter') open();
        if (e.key === 'Delete') doDelete(name);
        if (e.key === 'F2') startRename(d, name, item);
      });

      d.addEventListener('contextmenu', e => {
        e.preventDefault(); e.stopPropagation();
        $$('.fm-item', grid).forEach(x => x.classList.remove('sel'));
        d.classList.add('sel'); selected = name;

        const items = [
          { icon: item.type === 'dir' ? '📂' : '📝', label: '打开', action: open },
          { sep: true },
          { icon: '✏️', label: '重命名', action: () => startRename(d, name, item) },
          { icon: '🗑️', label: '删除', danger: true, action: () => doDelete(name) }
        ];
        if (item.type === 'file') {
          items.splice(2, 0, {
            icon: '⬇️', label: '下载',
            action: () => {
              const blob = new Blob([item.content || ''], { type: 'text/plain;charset=utf-8' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url; a.download = name;
              document.body.appendChild(a); a.click(); a.remove();
              setTimeout(() => URL.revokeObjectURL(url), 3000);
              notify('文件管理器', '已下载 ' + name, '⬇️', { type: 'ok' });
            }
          });
        }
        showMenu(e.clientX, e.clientY, items);
      });

      grid.appendChild(d);
    });

    upBtn.disabled = path.length === 0;
  }

  function startRename(itemEl, oldName, item) {
    const nm = itemEl.querySelector('.nm');
    const input = document.createElement('input');
    input.className = 'fm-rename';
    input.value = oldName;
    nm.replaceWith(input);
    input.focus(); input.select();

    let finished = false;
    const finish = ok => {
      if (finished) return;
      finished = true;
      const v = input.value.trim();
      const dir = fsResolve(path);
      if (ok && v && v !== oldName) {
        if (dir.children[v]) {
          notify('重命名失败', '已存在同名项目', '⚠️', { type: 'warn' });
          input.replaceWith(nm); return;
        }
        const rebuilt = {};
        Object.keys(dir.children).forEach(k => { rebuilt[k === oldName ? v : k] = k === oldName ? item : dir.children[k]; });
        dir.children = rebuilt;
        fsSave(); render();
        notify('文件管理器', '已重命名为「' + v + '」', '✏️', { type: 'ok' });
      } else input.replaceWith(nm);
    };

    input.addEventListener('blur', () => finish(true));
    input.addEventListener('keydown', e => {
      e.stopPropagation();
      if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      if (e.key === 'Escape') { e.preventDefault(); finish(false); }
    });
    input.addEventListener('pointerdown', e => e.stopPropagation());
  }

  function doDelete(name) {
    const dir = fsResolve(path);
    if (!dir || !dir.children[name]) return;
    delete dir.children[name];
    fsSave(); render();
    notify('文件管理器', '已删除「' + name + '」', '🗑️', { type: 'ok' });
  }

  function newItem(type) {
    const dir = fsResolve(path);
    if (!dir) return;
    if (type === 'dir') {
      const name = uniqName(dir, '新建文件夹', '');
      dir.children[name] = { type: 'dir', children: {} };
      fsSave(); render();
      notify('文件管理器', '已创建文件夹「' + name + '」', '📁', { type: 'ok' });
    } else {
      const name = uniqName(dir, '新建文本文档', '.txt');
      dir.children[name] = { type: 'file', content: '' };
      fsSave(); render();
      notify('文件管理器', '已创建「' + name + '」', '📄', { type: 'ok' });
    }
  }

  upBtn.addEventListener('click', () => { if (path.length) { path.pop(); render(); } });
  root.querySelector('.fm-refresh').addEventListener('click', () => { render(); notify('文件管理器', '已刷新', '⟳'); });
  root.querySelector('.fm-newdir').addEventListener('click', () => newItem('dir'));
  root.querySelector('.fm-newfile').addEventListener('click', () => newItem('file'));

  grid.addEventListener('contextmenu', e => {
    if (e.target.closest('.fm-item')) return;
    e.preventDefault();
    showMenu(e.clientX, e.clientY, [
      { icon: '📁', label: '新建文件夹', action: () => newItem('dir') },
      { icon: '📄', label: '新建文本文档', action: () => newItem('file') },
      { sep: true },
      { icon: '🔄', label: '刷新', action: render },
      { icon: '⬆️', label: '打开上级目录', action: () => { if (path.length) { path.pop(); render(); } } }
    ]);
  });

  grid.addEventListener('click', () => {
    $$('.fm-item', grid).forEach(x => x.classList.remove('sel'));
    selected = null;
  });

  render();

  const win = createWindow({
    appId: 'files', title: '文件管理器', icon: '📁',
    width: 740, height: 520, content: root
  });

  win.api.nav = p => { path = p.slice(); render(); };
  win.api.path = () => path.slice();
  win.api.getState = () => ({ path: path.slice() });
  return win;
}

/* ============================================================
   9. 应用：终端
   ============================================================ */
function openTerminal() {
  const root = document.createElement('div');
  root.className = 'app-term';
  root.innerHTML =
    '<div class="term-out"></div>' +
    '<div class="term-line">' +
      '<span class="term-ps"></span>' +
      '<input class="term-in" spellcheck="false" autocomplete="off" autocapitalize="off">' +
    '</div>';

  const out = root.querySelector('.term-out');
  const input = root.querySelector('.term-in');
  const psEl = root.querySelector('.term-ps');
  let cwd = [];
  const history = Cache.get('term.history', []);
  let histIdx = history.length;

  const prompt = () => 'user@webos:/' + cwd.join('/') + '$';
  const syncPrompt = () => { psEl.textContent = prompt(); };

  function print(text, cls) {
    const d = document.createElement('div');
    d.textContent = text;
    if (cls) d.className = cls;
    out.appendChild(d);
    root.scrollTop = root.scrollHeight;
  }

  function run(line) {
    const parts = line.trim().split(/\s+/);
    const cmd = parts[0] || '';
    const arg = parts.slice(1).join(' ');
    const node = fsResolve(cwd);

    switch (cmd) {
      case '': break;

      case 'help':
        print('可用命令：');
        print('  help / ls / cd / pwd / cat / echo / date / whoami');
        print('  mkdir <名>   touch <名>   rm <名>');
        print('  open <应用>  apps        neofetch');
        print('  cache        查看缓存信息');
        print('  clear        清屏');
        break;

      case 'apps':
        print(Object.keys(APPS).map(k => k + ' (' + APPS[k].name + ')').join('\n'));
        break;

      case 'cache': {
        const s = Cache.stats();
        print('本地缓存使用：' + s.pretty + ' / 约 5.00 MB');
        print('键数量：' + s.count);
        print('版本：v' + Cache.VERSION + '   命名空间：' + Cache.PREFIX);
        print('');
        print('键名                        大小');
        print('─'.repeat(38));
        s.items.slice(0, 12).forEach(it => {
          print(it.key.padEnd(26).slice(0, 26) + '  ' + Cache.prettyBytes(it.bytes));
        });
        if (s.items.length > 12) print('… 其余 ' + (s.items.length - 12) + ' 项');
        break;
      }

      case 'ls': {
        const names = Object.keys(node.children || {});
        if (!names.length) { print('(空目录)'); break; }
        print(names.map(n => node.children[n].type === 'dir' ? n + '/' : n).join('   '));
        break;
      }

      case 'cd': {
        if (!arg || arg === '~' || arg === '/') { cwd = []; break; }
        if (arg === '..') { cwd.pop(); break; }
        const segs = arg.replace(/^\/+|\/+$/g, '').split('/').filter(Boolean);
        for (const s of segs) {
          if (s === '..') { cwd.pop(); continue; }
          const cur = fsResolve(cwd);
          if (cur.children && cur.children[s] && cur.children[s].type === 'dir') cwd.push(s);
          else { print('cd: 找不到目录: ' + s, 'term-err'); break; }
        }
        break;
      }

      case 'pwd': print('/' + cwd.join('/')); break;

      case 'cat': {
        if (!arg) { print('cat: 缺少文件名', 'term-err'); break; }
        const f = node.children && node.children[arg];
        if (f && f.type === 'file') print(f.content || '(空文件)');
        else if (f && f.type === 'dir') print('cat: ' + arg + ': 是一个目录', 'term-err');
        else print('cat: ' + arg + ': 没有那个文件', 'term-err');
        break;
      }

      case 'echo': print(arg); break;
      case 'date': print(new Date().toLocaleString('zh-CN')); break;
      case 'whoami': print('user'); break;

      case 'mkdir': {
        if (!arg) { print('mkdir: 缺少目录名', 'term-err'); break; }
        if (node.children[arg]) { print('mkdir: 已存在: ' + arg, 'term-err'); break; }
        node.children[arg] = { type: 'dir', children: {} };
        fsSave(); print('已创建目录 ' + arg, 'term-ok');
        break;
      }

      case 'touch': {
        if (!arg) { print('touch: 缺少文件名', 'term-err'); break; }
        if (!node.children[arg]) node.children[arg] = { type: 'file', content: '' };
        fsSave(); print('已创建文件 ' + arg, 'term-ok');
        break;
      }

      case 'rm': {
        if (!arg) { print('rm: 缺少名称', 'term-err'); break; }
        if (!node.children[arg]) { print('rm: 没有那个文件或目录: ' + arg, 'term-err'); break; }
        delete node.children[arg];
        fsSave(); print('已删除 ' + arg, 'term-ok');
        break;
      }

      case 'clear': out.innerHTML = ''; break;

      case 'open': {
        const app = APPS[arg];
        if (app) { print('正在打开 ' + app.name + ' …', 'term-ok'); app.open(); }
        else print('未知应用: ' + arg + '（输入 apps 查看全部）', 'term-err');
        break;
      }

      case 'neofetch':
        print(
          '        ▄▄▄▄▄▄        user@webos\n' +
          '     ▄████████▄▄     ----------\n' +
          '   ▄████████████▄    OS: WebOS 1.3\n' +
          '  ██████████████    Kernel: JavaScript\n' +
          '  ██████████████    Shell: web-sh\n' +
          '   ▀██████████▀     Resolution: ' + window.innerWidth + 'x' + window.innerHeight + '\n' +
          '     ▀██████▀       Theme: ' + document.body.dataset.theme + '\n' +
          '                    Windows: ' + wins.size + '\n' +
          '                    Links: ' + NAV_LINKS.length + '\n' +
          '                    Cache: ' + Cache.stats().pretty + '\n',
          'term-ok'
        );
        break;

      default:
        print(cmd + ': 未找到命令（输入 help 查看帮助）', 'term-err');
    }
  }

  function complete() {
    const val = input.value;
    const parts = val.split(/\s+/);
    const last = parts[parts.length - 1] || '';
    const node = fsResolve(cwd);
    const names = Object.keys(node.children || {}).filter(n => n.startsWith(last));
    if (!names.length) return;
    if (names.length === 1) { parts[parts.length - 1] = names[0]; input.value = parts.join(' '); }
    else { print(prompt() + ' ' + val); print(names.join('   ')); }
  }

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const line = input.value;
      print(prompt() + ' ' + line);
      if (line.trim()) {
        history.push(line);
        if (history.length > 80) history.shift();
        Cache.set('term.history', history);
        histIdx = history.length;
      }
      input.value = '';
      run(line);
      syncPrompt();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (histIdx > 0) { histIdx--; input.value = history[histIdx]; }
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (histIdx < history.length - 1) { histIdx++; input.value = history[histIdx]; }
      else { histIdx = history.length; input.value = ''; }
    } else if (e.key === 'Tab') {
      e.preventDefault(); complete();
    } else if (e.key === 'l' && e.ctrlKey) {
      e.preventDefault(); out.innerHTML = '';
    }
  });

  root.addEventListener('click', () => {
    if (!window.getSelection().toString()) input.focus();
  });

  syncPrompt();
  print('WebOS Shell v1.3  —  输入 help 查看可用命令', 'term-ok');
  print('提示：输入 cache 查看缓存，输入 open webnav 打开网址导航', 'term-ok');
  print('');

  const win = createWindow({
    appId: 'term', title: '终端', icon: '⌨️',
    width: 720, height: 450, content: root
  });
  win.api.focus = () => input.focus();
  setTimeout(() => input.focus(), 80);
  return win;
}

/* ============================================================
   10. 应用：画图
   ============================================================ */
function openPaint() {
  const ex = findWin('paint');
  if (ex) { restoreWin(ex); focusWin(ex); return ex; }

  const COLORS = ['#111111', '#ffffff', '#e74c3c', '#e67e22', '#f1c40f', '#2ecc71', '#3498db', '#9b59b6', '#ff6ec7', '#7f8c8d'];

  const root = document.createElement('div');
  root.className = 'app-paint';
  root.innerHTML =
    '<div class="paint-bar">' +
      '<div class="swatches">' +
        COLORS.map((c, i) => '<div class="swatch' + (i === 0 ? ' active' : '') + '" data-c="' + c + '" style="background:' + c + '"></div>').join('') +
      '</div>' +
      '<input type="range" min="1" max="40" value="5" title="笔刷大小">' +
      '<button class="p-eraser">橡皮</button>' +
      '<button class="p-undo">撤销</button>' +
      '<button class="p-clear">清空</button>' +
      '<button class="p-load">载入</button>' +
      '<button class="p-save">保存到本地</button>' +
      '<button class="p-dl">下载图片</button>' +
    '</div>' +
    '<div class="paint-canvas"><canvas></canvas></div>';

  const wrap = root.querySelector('.paint-canvas');
  const canvas = root.querySelector('canvas');
  const sizeInput = root.querySelector('input[type=range]');
  let ctx = canvas.getContext('2d');
  let color = COLORS[0], size = 5, eraser = false, drawing = false, last = null;
  const undoStack = [], redoStack = [];
  const MAX_UNDO = 25;

  function snapshot() { try { return canvas.toDataURL('image/png'); } catch (e) { return null; } }
  function pushUndo() {
    const s = snapshot();
    if (!s) return;
    undoStack.push(s);
    if (undoStack.length > MAX_UNDO) undoStack.shift();
    redoStack.length = 0;
  }
  function loadImage(data, cb) {
    if (!data) { if (cb) cb(); return; }
    const img = new Image();
    img.onload = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      if (cb) cb();
    };
    img.src = data;
  }

  function fit() {
    const w = wrap.clientWidth, h = wrap.clientHeight;
    if (w <= 0 || h <= 0) return;
    const snap = snapshot();
    canvas.width = w; canvas.height = h;
    ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
    if (snap) loadImage(snap);
  }

  function pos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function strokeStyle() { return eraser ? '#ffffff' : color; }

  canvas.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    pushUndo();
    drawing = true;
    last = pos(e);
    canvas.setPointerCapture(e.pointerId);
    ctx.fillStyle = strokeStyle();
    ctx.beginPath();
    ctx.arc(last.x, last.y, size / 2, 0, Math.PI * 2);
    ctx.fill();
  });
  canvas.addEventListener('pointermove', e => {
    if (!drawing) return;
    const p = pos(e);
    ctx.strokeStyle = strokeStyle();
    ctx.lineWidth = size;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    last = p;
  });
  const endDraw = () => { drawing = false; last = null; };
  canvas.addEventListener('pointerup', endDraw);
  canvas.addEventListener('pointercancel', endDraw);
  canvas.addEventListener('pointerleave', endDraw);

  root.querySelector('.swatches').addEventListener('click', e => {
    const s = e.target.closest('.swatch');
    if (!s) return;
    color = s.dataset.c;
    eraser = false;
    root.querySelector('.p-eraser').classList.remove('on');
    $$('.swatch', root).forEach(x => x.classList.toggle('active', x === s));
  });
  sizeInput.addEventListener('input', () => { size = +sizeInput.value; });
  root.querySelector('.p-eraser').addEventListener('click', e => {
    eraser = !eraser;
    e.target.classList.toggle('on', eraser);
  });
  root.querySelector('.p-undo').addEventListener('click', () => {
    if (!undoStack.length) { notify('画图', '没有可撤销的操作', '↩️', { type: 'warn' }); return; }
    const cur = snapshot();
    const prev = undoStack.pop();
    if (cur) redoStack.push(cur);
    loadImage(prev);
  });
  root.querySelector('.p-clear').addEventListener('click', () => {
    pushUndo();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    notify('画图', '画布已清空', '🧽');
  });

  /* 保存到本地缓存 */
  root.querySelector('.p-save').addEventListener('click', () => {
    const data = canvas.toDataURL('image/png');
    const sizeKB = Math.round(data.length / 1024);
    if (sizeKB > 900) {
      notify('画图', '作品太大（约 ' + sizeKB + ' KB），未保存以避免缓存溢出', '⚠️', { type: 'warn' });
      return;
    }
    const r = Cache.set('paint.work', data);
    if (r.ok) notify('画图', '已保存到本地（约 ' + sizeKB + ' KB）', '💾', { type: 'ok' });
    else notify('画图', '保存失败：' + r.error, '⚠️', { type: 'err' });
  });

  /* 从本地载入 */
  root.querySelector('.p-load').addEventListener('click', () => {
    const data = Cache.get('paint.work', null);
    if (!data) { notify('画图', '没有找到已保存的作品', 'ℹ️'); return; }
    pushUndo();
    loadImage(data, () => notify('画图', '已载入上次保存的作品', '📂', { type: 'ok' }));
  });

  /* 下载为图片文件 */
  root.querySelector('.p-dl').addEventListener('click', () => {
    const a = document.createElement('a');

/* ============================================================
   11. 应用：贪吃蛇
   ============================================================ */
function openSnake() {
  const ex = findWin('snake');
  if (ex) { restoreWin(ex); focusWin(ex); return ex; }

  const CELL = 18, N = 20;
  const root = document.createElement('div');
  root.className = 'app-snake';
  root.innerHTML =
    '<div class="snake-hud">' +
      '<div>得分 <b class="s-score">0</b></div>' +
      '<div>最高 <b class="s-best">0</b></div>' +
      '<div>速度 <select class="s-speed">' +
        '<option value="150">慢</option>' +
        '<option value="110" selected>中</option>' +
        '<option value="75">快</option>' +
      '</select></div>' +
      '<div><label><input type="checkbox" class="s-wrap"> 穿墙</label></div>' +
    '</div>' +
    '<div class="snake-wrap">' +
      '<canvas width="' + (CELL * N) + '" height="' + (CELL * N) + '"></canvas>' +
      '<div class="snake-over"></div>' +
    '</div>' +
    '<div style="font-size:11.5px;color:#7d849a">方向键 / WASD 控制 · 空格暂停或重开</div>';

  const canvas = root.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = root.querySelector('.s-score');
  const bestEl = root.querySelector('.s-best');
  const overEl = root.querySelector('.snake-over');
  const speedSel = root.querySelector('.s-speed');
  const wrapChk = root.querySelector('.s-wrap');

  let snake, dir, nextDir, food, score, over, paused, timer;
  let best = Cache.get('snake.best', 0);
  bestEl.textContent = best;
  speedSel.value = String(Cache.get('snake.speed', 110));
  wrapChk.checked = !!Cache.get('snake.wrap', false);

  function placeFood() {
    let p, guard = 0;
    do { p = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; guard++; }
    while (snake.some(s => s.x === p.x && s.y === p.y) && guard < 500);
    food = p;
  }

  function startTimer() {
    clearInterval(timer);
    timer = setInterval(tick, +speedSel.value);
  }

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0; over = false; paused = false;
    overEl.classList.remove('show');
    scoreEl.textContent = '0';
    placeFood();
    draw();
    startTimer();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  function draw() {
    ctx.fillStyle = '#0e0e16';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(255,255,255,.045)';
    ctx.lineWidth = 1;
    for (let i = 1; i < N; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
    }
    const t = Date.now() / 350;
    const pr = (CELL - 4) / 2 + Math.sin(t) * 1.2;
    ctx.fillStyle = '#ff5d5d';
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, pr, 0, Math.PI * 2);
    ctx.fill();

    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#6ee7a0' : 'hsl(152,52%,' + Math.max(26, 52 - i * 1.4) + '%)';
      roundRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2, 4);
    });

    if (over) {
      overEl.innerHTML = '游戏结束<br>得分：' + score + '<small>按空格键重新开始</small>';
      overEl.classList.add('show');
    } else if (paused) {
      overEl.innerHTML = '已暂停<small>按空格键继续</small>';
      overEl.classList.add('show');
    } else overEl.classList.remove('show');
  }

  function tick() {
    if (over || paused) return;
    dir = nextDir;
    let head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (wrapChk.checked) {
      head.x = (head.x + N) % N;
      head.y = (head.y + N) % N;
    } else if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N) { gameOver(); return; }
    if (snake.some(s => s.x === head.x && s.y === head.y)) { gameOver(); return; }

    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      placeFood();
    } else snake.pop();
    draw();
  }

  function gameOver() {
    over = true;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      Cache.set('snake.best', best);
      notify('贪吃蛇', '新纪录！' + best + ' 分', '🏆', { type: 'ok', sound: true });
    }
    draw();
  }

  const KEYMAP = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
    W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0]
  };

  const win = createWindow({
    appId: 'snake', title: '贪吃蛇', icon: '🐍',
    width: 440, height: 570, content: root
  });

  function onKey(e) {
    if (win.minimized || !win.el.classList.contains('active')) return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    const v = KEYMAP[e.key];
    if (v) {
      e.preventDefault();
      if (v[0] === -dir.x && v[1] === -dir.y) return;
      if (v[0] === dir.x && v[1] === dir.y) return;
      nextDir = { x: v[0], y: v[1] };
      return;
    }
    if (e.key === ' ') {
      e.preventDefault();
      if (over) reset();
      else { paused = !paused; draw(); }
    }
  }

  speedSel.addEventListener('change', () => {
    Cache.set('snake.speed', +speedSel.value);
    startTimer();
  });
  wrapChk.addEventListener('change', () => Cache.set('snake.wrap', wrapChk.checked));

  document.addEventListener('keydown', onKey);
  reset();

  win.api.onClose = () => {
    clearInterval(timer);
    document.removeEventListener('keydown', onKey);
  };
  return win;
}

function openTodo() {
  const ex = findWin('todo');
  if (ex) { restoreWin(ex); focusWin(ex); return ex; }

  const root = document.createElement('div');
  root.className = 'app-todo';
  root.innerHTML =
    '<div class="todo-head">' +
      '<input placeholder="添加一个任务，回车确认…" maxlength="120">' +
      '<button>添加</button>' +
    '</div>' +
    '<div class="todo-stat">' +
      '<span class="ts-left">0 项待完成</span>' +
      '<button class="ts-clear">清除已完成</button>' +
    '</div>' +
    '<div class="todo-list"></div>';

  const inp = root.querySelector('input');
  const list = root.querySelector('.todo-list');
  const leftEl = root.querySelector('.ts-left');

  let todos = Cache.get('todos', [
    { id: 1, text: '体验一下网页桌面', done: true },
    { id: 2, text: '打开「网址导航」逛逛收藏的网站', done: false },
    { id: 3, text: '在设置里导出一份备份', done: false }
  ]);
  let nextId = todos.reduce((m, t) => Math.max(m, t.id || 0), 0) + 1;

  function save() { Cache.set('todos', todos); }

  function render() {
    list.innerHTML = '';
    if (!todos.length) list.innerHTML = '<div class="todo-empty">✨ 暂无任务，添加一个开始吧</div>';
    todos.forEach(t => {
      const el = document.createElement('div');
      el.className = 'todo-item' + (t.done ? ' done' : '');
      el.innerHTML =
        '<div class="cb">✓</div>' +
        '<div class="tx">' + esc(t.text) + '</div>' +
        '<button class="del">✕</button>';
      el.querySelector('.cb').addEventListener('click', () => { t.done = !t.done; save(); render(); });
      el.querySelector('.del').addEventListener('click', () => {
        todos = todos.filter(x => x.id !== t.id);
        save(); render();
      });
      list.appendChild(el);
    });
    const left = todos.filter(t => !t.done).length;
    leftEl.textContent = left + ' 项待完成 / 共 ' + todos.length + ' 项';
  }

  function add() {
    const v = inp.value.trim();
    if (!v) return;
    todos.unshift({ id: nextId++, text: v, done: false });
    inp.value = '';
    save(); render();
  }

  root.querySelector('.todo-head button').addEventListener('click', add);
  inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') add(); });
  root.querySelector('.ts-clear').addEventListener('click', () => {
    const n = todos.filter(t => t.done).length;
    if (!n) { notify('待办清单', '没有已完成的任务', 'ℹ️'); return; }
    todos = todos.filter(t => !t.done);
    save(); render();
    notify('待办清单', '已清除 ' + n + ' 项', '🧹', { type: 'ok' });
  });

  render();

  const win = createWindow({
    appId: 'todo', title: '待办清单', icon: '✅',
    width: 460, height: 520, content: root
  });
  setTimeout(() => inp.focus(), 100);
  return win;
}
