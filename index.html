/* ---- 数据层 ---- */
let NAV_LINKS = Cache.get('nav.links', null);
if (!Array.isArray(NAV_LINKS) || !NAV_LINKS.length) {
  NAV_LINKS = JSON.parse(JSON.stringify(DEFAULT_NAV_LINKS));
}
let NAV_FAVS = Cache.get('nav.favs', []);
if (!Array.isArray(NAV_FAVS)) NAV_FAVS = [];
let NAV_RECENT = Cache.get('nav.recent', []);
if (!Array.isArray(NAV_RECENT)) NAV_RECENT = [];

function navIsFav(url) { return NAV_FAVS.indexOf(url) !== -1; }

function navFolderCard(key, emoji, name, count) {
  return '<button class="nav-folder" data-key="' + esc(key) + '">' +
    '<span class="nf-ic">' + emoji + '</span>' +
    '<span class="nf-nm">' + esc(name) + '</span>' +
    '<span class="nf-ct">' + esc(count) + '</span>' +
  '</button>';
}

function navLinksHTML(list) {
  if (!list.length) return '<div class="nav-empty">😕 这里暂时是空的</div>';
  let html = '<div class="nav-links">';
  list.forEach(item => {
    const fav = navIsFav(item.url);
    html +=
      '<div class="nav-link' + (fav ? ' fav' : '') + '" data-url="' + esc(item.url) + '" title="' + esc(item.name) + '">' +
        '<button class="nav-star' + (fav ? ' on' : '') + '" data-star="' + esc(item.url) + '" title="' + (fav ? '取消收藏' : '加入收藏') + '">' + (fav ? '★' : '☆') + '</button>' +
        '<div class="nav-emoji">' + (item.emoji || '🌐') + '</div>' +
        '<div class="nav-name">' + esc(item.name) + '</div>' +
      '</div>';
  });
  return html + '</div>';
}

/* ---- 打开链接 ---- */
function openNavLink(url) {
  const item = NAV_LINKS.find(i => i.url === url);
  if (!item) return;

  NAV_RECENT = NAV_RECENT.filter(r => r.url !== item.url);
  NAV_RECENT.unshift({ name: item.name, emoji: item.emoji, url: item.url, category: item.category, ts: Date.now() });
  if (NAV_RECENT.length > 24) NAV_RECENT.length = 24;
  Cache.set('nav.recent', NAV_RECENT);

  if (NO_IFRAME_CATEGORIES.indexOf(item.category) !== -1) {
    window.open(item.url, '_blank');
    notify('网址导航', '已在新标签页打开 ' + item.name, item.emoji || '🌐');
    return;
  }
  openUrlWindow(item);
}

function openUrlWindow(item) {
  const appId = 'url::' + item.url;
  const ex = findWin(appId);
  if (ex) { restoreWin(ex); focusWin(ex); return ex; }

  const root = document.createElement('div');
  root.className = 'app-url';
  root.innerHTML =
    '<div class="url-loading">' +
      '<div class="url-spinner"></div>' +
      '<div class="url-tip">正在打开 ' + esc(item.name) + ' …</div>' +
      '<div class="url-sub">' + esc(item.url) + '</div>' +
      '<div class="url-acts"><button class="url-open">在新标签页打开</button></div>' +
    '</div>';

  const frame = document.createElement('iframe');
  frame.className = 'url-frame';
  frame.src = item.url;
  frame.referrerPolicy = 'no-referrer';
  frame.allow = 'fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture';
  root.appendChild(frame);

  const loading = root.querySelector('.url-loading');
  let done = false;
  const finish = () => { if (done) return; done = true; loading.classList.add('hide'); };
  frame.addEventListener('load', finish);
  frame.addEventListener('error', finish);
  setTimeout(finish, 9000);

  root.querySelector('.url-open').addEventListener('click', () => window.open(item.url, '_blank'));

  const win = createWindow({
    appId: appId,
    title: item.name,
    icon: item.emoji || '🌐',
    width: Math.min(940, desktop.clientWidth - 30),
    height: Math.min(660, desktop.clientHeight - 30),
    content: root
  });
  return win;
}

/* ---- 主应用 ---- */
function openWebNav(startKey) {
  const ex = findWin('webnav');
  if (ex) {
    restoreWin(ex); focusWin(ex);
    if (startKey && ex.api.go) ex.api.go(startKey);
    return ex;
  }

  const root = document.createElement('div');
  root.className = 'app-nav';
  root.innerHTML =
    '<div class="nav-bar">' +
      '<input class="nav-search" placeholder="🔍 搜索链接、分类、网址…" spellcheck="false" autocomplete="off">' +
      '<button class="nav-add" title="添加自定义链接">＋ 添加</button>' +
    '</div>' +
    '<div class="nav-body"></div>';

  const searchEl = root.querySelector('.nav-search');
  const bodyEl = root.querySelector('.nav-body');

  let view = { type: 'folders', key: null, q: '' };

  function go(key) {
    if (key === null || key === undefined) view = { type: 'folders', key: null, q: '' };
    else view = { type: 'cat', key: key, q: '' };
    searchEl.value = '';
    render();
    bodyEl.scrollTop = 0;
  }

  function foldersHTML() {
    let html = '';
    const favCount = NAV_LINKS.filter(i => navIsFav(i.url)).length;
    const recentCount = NAV_RECENT.length;
    if (favCount || recentCount) {
      html += '<div class="nav-sec">快捷入口</div><div class="nav-grid">';
      if (favCount) html += navFolderCard('__fav', '⭐', '我的收藏', favCount + ' 个链接');
      if (recentCount) html += navFolderCard('__recent', '🕒', '最近访问', recentCount + ' 个链接');
      html += '</div>';
    }
    html += '<div class="nav-sec">全部分类</div><div class="nav-grid">';
    Object.keys(NAV_CATEGORIES).forEach(k => {
      const c = NAV_CATEGORIES[k];
      const n = NAV_LINKS.filter(i => i.category === k).length;
      html += navFolderCard(k, c.emoji, c.label, n + ' 个链接');
    });
    html += navFolderCard('__all', '📂', '全部链接', NAV_LINKS.length + ' 个链接');
    html += '</div>';
    return html;
  }

  function render() {
    const q = view.q.trim().toLowerCase();
    if (q) {
      const res = NAV_LINKS.filter(i => {
        const label = (NAV_CATEGORIES[i.category] || {}).label || '';
        return i.name.toLowerCase().indexOf(q) !== -1 ||
               String(i.category).toLowerCase().indexOf(q) !== -1 ||
               label.toLowerCase().indexOf(q) !== -1 ||
               String(i.url || '').toLowerCase().indexOf(q) !== -1;
      });
      bodyEl.innerHTML = '<div class="nav-sec">搜索结果 · ' + res.length + ' 个</div>' + navLinksHTML(res);
      return;
    }
    if (view.type === 'folders') { bodyEl.innerHTML = foldersHTML(); return; }

    let list, title, emoji;
    if (view.key === '__all') { list = NAV_LINKS.slice(); title = '全部链接'; emoji = '📂'; }
    else if (view.key === '__fav') { list = NAV_LINKS.filter(i => navIsFav(i.url)); title = '我的收藏'; emoji = '⭐'; }
    else if (view.key === '__recent') {
      list = NAV_RECENT.map(r => ({ name: r.name, emoji: r.emoji, url: r.url, category: r.category }));
      title = '最近访问'; emoji = '🕒';
    } else {
      const c = NAV_CATEGORIES[view.key] || { label: view.key, emoji: '📁' };
      list = NAV_LINKS.filter(i => i.category === view.key);
      title = c.label; emoji = c.emoji;
    }

    bodyEl.innerHTML =
      '<div class="nav-head">' +
        '<button class="nav-back">← 返回</button>' +
        '<div class="nav-title">' + emoji + ' ' + esc(title) + '</div>' +
        '<div class="nav-count">' + list.length + ' 个</div>' +
      '</div>' + navLinksHTML(list);
  }

  /* 事件委托 */
  bodyEl.addEventListener('click', e => {
    const star = e.target.closest('[data-star]');
    if (star) {
      e.stopPropagation();
      const url = star.dataset.star;
      const i = NAV_FAVS.indexOf(url);
      if (i === -1) NAV_FAVS.unshift(url);
      else NAV_FAVS.splice(i, 1);
      Cache.set('nav.favs', NAV_FAVS);
      render();
      return;
    }
    const back = e.target.closest('.nav-back');
    if (back) { go(null); return; }
    const folder = e.target.closest('[data-key]');
    if (folder) { go(folder.dataset.key); return; }
    const link = e.target.closest('.nav-link');
    if (link) { openNavLink(link.dataset.url); return; }
  });

  searchEl.addEventListener('input', () => { view.q = searchEl.value; render(); });
  searchEl.addEventListener('keydown', e => {
    if (e.key === 'Escape') { searchEl.value = ''; view.q = ''; render(); searchEl.blur(); }
  });

  root.querySelector('.nav-add').addEventListener('click', () => {
    const name = prompt('请输入链接名称：', '我的网站');
    if (!name || !name.trim()) return;
    const urlInput = prompt('请输入网址：', 'https://example.com');
    if (!urlInput || !urlInput.trim()) return;
    let url = urlInput.trim();
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    const emoji = (prompt('请输入一个图标表情（如 🌐）：', '🌐') || '🌐').trim() || '🌐';
    const cats = Object.keys(NAV_CATEGORIES).join(' / ');
    const catInput = prompt('请输入分类（' + cats + '）：', '工具');
    const cat = Object.keys(NAV_CATEGORIES).indexOf(catInput) !== -1 ? catInput : '工具';
    NAV_LINKS.push({ name: name.trim(), emoji: emoji, url: url, category: cat });
    Cache.set('nav.links', NAV_LINKS);
    go(cat);
    notify('网址导航', '已添加「' + name.trim() + '」', '➕', { type: 'ok' });
  });

  render();

  const win = createWindow({
    appId: 'webnav', title: '网址导航', icon: '🌐',
    width: 820, height: 600, content: root
  });
  win.api.go = go;
  win.api.getState = () => ({ key: view.type === 'cat' ? view.key : null });
  if (startKey) go(startKey);
  return win;
}

  function renderStorage() {

        '<span>' + pct + '% · ' + s.count + ' 项</span>' +

            '<span class="sl-size">' + Cache.prettyBytes(it.bytes) + '</span>' +
            '<button class="sl-del" title="删除此项">✕</button>' +
          '</div>';
      });

    html += '<div class="set-actions">' +

    storageCard.querySelector('#btnClean').addEventListener('click', () => {
      let freed = 0;
      ['notepad.draft', 'calc.expr', 'calc.history', 'term.history', 'notifyHistory', 'session'].forEach(k => {
        if (Cache.has(k)) { freed += Cache.sizeOf(k); Cache.del(k); }
      });
      notify('缓存管理', '已释放 ' + Cache.prettyBytes(freed), '🧹', { type: 'ok' });
      renderStorage();
    });

    storageCard.querySelector('#btnClearAll').addEventListener('click', () => {
      if (!confirm('确定要清空全部本地缓存吗？\n包含文件、便签、待办、网址导航、设置等所有数据。')) return;

    $$('.sl-del', storageCard).forEach(b => {
      b.addEventListener('click', e => {
        const row = e.target.closest('.sl-row');

        notify('缓存管理', '已删除键：' + k, '🗑️');

  renderStorage();
  refreshCounts();

  /* 自动保存开关 */

  autoSaveSw.addEventListener('click', () => {
    const on = !autoSaveSw.classList.contains('on');
    autoSaveSw.classList.toggle('on', on);
    Cache.set('autoSave', on);
    notify('设置', '自动保存已' + (on ? '开启' : '关闭'), on ? '💾' : '⚠️', { type: on ? 'ok' : 'warn' });
  });

  /* 导出 */
  root.querySelector('#btnExport').addEventListener('click', () => {
    const data = Cache.exportAll();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    a.href = url;
    a.download = 'webos-backup-' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '-' + pad2(d.getHours()) + pad2(d.getMinutes()) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    notify('备份', '已导出 ' + Object.keys(data.data).length + ' 项数据', '📦', { type: 'ok' });
  });

  /* 导入 */
  const fileInput = root.querySelector('#fileImport');
  root.querySelector('#btnImport').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    const f = fileInput.files && fileInput.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const json = JSON.parse(reader.result);
        const r = Cache.importAll(json);
        notify('恢复', '成功导入 ' + r.okCount + ' 项' + (r.failCount ? '，失败 ' + r.failCount + ' 项' : ''), '📥', { type: r.failCount ? 'warn' : 'ok' });
        setTimeout(() => location.reload(), 900);
      } catch (err) {
        notify('恢复失败', err.message || '文件解析错误', '⚠️', { type: 'err' });
      }
      fileInput.value = '';
    };
    reader.readAsText(f);
  });

  /* 复制为文本 */
  root.querySelector('#btnCopy').addEventListener('click', () => {
    const data = Cache.exportAll();
    const text = JSON.stringify(data);
    const done = () => notify('备份', 'JSON 已复制到剪贴板', '📋', { type: 'ok' });
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => {
        fallbackCopy(text); done();
      });
    } else { fallbackCopy(text); done(); }
  });

  function fallbackCopy(t) {
    const ta = document.createElement('textarea');
    ta.value = t;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(e) {}

    a.download = 'webnav-links-' + Date.now() + '.json';

    const f = linkFile.files && linkFile.files[0];

    const reader = new FileReader();
    reader.onload = () => {
      try {
        const json = JSON.parse(reader.result);
        const list = Array.isArray(json) ? json : json.links;
        if (!Array.isArray(list)) throw new Error('文件中没有找到 links 数组');
        const clean = list.filter(i => i && i.url).map(i => ({
          name: String(i.name || i.url),
          emoji: String(i.emoji || '🌐'),
          url: String(i.url),
          category: NAV_CATEGORIES[i.category] ? i.category : '工具'
        }));
        if (!clean.length) throw new Error('没有有效的链接');
        NAV_LINKS = clean;
        Cache.set('nav.links', NAV_LINKS);
        if (Array.isArray(json.favorites)) { NAV_FAVS = json.favorites.slice(); Cache.set('nav.favs', NAV_FAVS); }
        refreshCounts();
        notify('网址导航', '成功导入 ' + clean.length + ' 个链接', '📥', { type: 'ok' });
      } catch (err) {
        notify('导入失败', err.message || '文件解析错误', '⚠️', { type: 'err' });
      }
      linkFile.value = '';
    };
    reader.readAsText(f);
  });

  root.querySelector('#btnLinkReset').addEventListener('click', () => {
    if (!confirm('确定恢复默认链接数据吗？\n自定义添加的链接会被清除。')) return;
    NAV_LINKS = JSON.parse(JSON.stringify(DEFAULT_NAV_LINKS));
    NAV_FAVS = [];
    NAV_RECENT = [];
    Cache.set('nav.links', NAV_LINKS);
    Cache.set('nav.favs', NAV_FAVS);
    Cache.set('nav.recent', NAV_RECENT);
    refreshCounts();
    notify('网址导航', '已恢复 ' + NAV_LINKS.length + ' 个默认链接', '♻️', { type: 'ok' });
  });

  /* 壁纸 */
  const list = root.querySelector('.wall-list');
  WALLPAPERS.forEach((w, i) => {
    const d = document.createElement('div');
    d.className = 'wall-item' + (i === currentWall ? ' active' : '');
    d.style.background = w;
    d.addEventListener('click', () => {
      setWallpaper(i);
      $$('.wall-item', list).forEach((x, j) => x.classList.toggle('active', j === i));
    });
    list.appendChild(d);
  });

  /* 主题 */
  $$('.theme-row button[data-t]', root).forEach(b => {
    b.classList.toggle('active', document.body.dataset.theme === b.dataset.t);
    b.addEventListener('click', () => setTheme(b.dataset.t));
  });

  root.querySelector('.set-reset-icon').addEventListener('click', () => {
    resetIconPositions();
    notify('设置', '桌面图标已重新排列', '🔄');
  });

  root.querySelector('.set-clear-notify').addEventListener('click', () => {
    notifyHistory = [];
    Cache.set('notifyHistory', []);
    updateNotifyDot();
    notify('设置', '通知历史已清空', '🔔', { type: 'ok' });
  });

  root.querySelector('.set-reset-all').addEventListener('click', () => {
    if (!confirm('确定要恢复出厂设置吗？\n所有文件、便签、待办、链接、设置和缓存都会被清除。')) return;
    Cache.clear();
    setTimeout(() => location.reload(), 500);
  });

  const win = createWindow({
    appId: 'settings', title: '设置', icon: '⚙️',
    width: 600, height: 600, content: root
  });
  win.api.refresh = () => { renderStorage(); refreshCounts(); };
  return win;
}

/* ============================================================
   16. 桌面图标
   ============================================================ */
const ICON_ORDER = ['webnav', 'files', 'notepad', 'todo', 'calc', 'term', 'paint', 'snake', 'settings'];
let iconPositions = Cache.get('iconPos', null);

function defaultPos(i) {
  const col = Math.floor(i / 5);
  const row = i % 5;
  return { x: 16 + col * 102, y: 16 + row * 106 };
}

function buildIcons() {
  $$('.desk-icon').forEach(el => el.remove());
  ICON_ORDER.forEach((appId, i) => {
    const app = APPS[appId];
    const el = document.createElement('div');
    el.className = 'desk-icon';
    el.dataset.app = appId;
    el.innerHTML = '<div class="ic">' + app.icon + '</div><div class="ic-label">' + esc(app.name) + '</div>';

    const pos = (iconPositions && iconPositions[appId]) || defaultPos(i);
    el.style.left = pos.x + 'px';
    el.style.top = pos.y + 'px';

    el.addEventListener('pointerdown', e => {
      if (e.button === 2) return;
      if (!el.classList.contains('selected')) {
        $$('.desk-icon').forEach(x => x.classList.remove('selected'));
        el.classList.add('selected');
      }
    });
    el.addEventListener('dblclick', () => app.open());

    let dragging = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0, raf = null, nx = 0, ny = 0;
    el.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      dragging = true; moved = false;
      sx = e.clientX; sy = e.clientY;
      ox = parseInt(el.style.left, 10) || 0;
      oy = parseInt(el.style.top, 10) || 0;
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', e => {
      if (!dragging) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (!moved && Math.abs(dx) + Math.abs(dy) < 5) return;
      moved = true;
      el.classList.add('dragging');
      nx = Math.max(0, Math.min(ox + dx, desktop.clientWidth - 92));
      ny = Math.max(0, Math.min(oy + dy, desktop.clientHeight - 96));
      if (!raf) raf = requestAnimationFrame(() => {
        raf = null;
        el.style.left = nx + 'px';
        el.style.top = ny + 'px';
      });
    });
    const endDrag = () => {
      if (!dragging) return;
      dragging = false;
      el.classList.remove('dragging');
      if (raf) { cancelAnimationFrame(raf); raf = null; }
      if (moved) {
        iconPositions = iconPositions || {};
        iconPositions[appId] = { x: parseInt(el.style.left, 10), y: parseInt(el.style.top, 10) };
        Cache.set('iconPos', iconPositions);
      }
    };
    el.addEventListener('pointerup', endDrag);
    el.addEventListener('pointercancel', endDrag);
    desktop.appendChild(el);
  });
}

function resetIconPositions() {
  iconPositions = null;
  Cache.del('iconPos');
  buildIcons();
}

buildIcons();

/* 桌面框选 */
(function boxSelect() {
  let active = false, sx = 0, sy = 0;
  desktop.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target !== desktop) return;
    active = true;
    sx = e.clientX; sy = e.clientY;
    const dr = desktop.getBoundingClientRect();
    selBox.style.display = 'block';
    selBox.style.left = (sx - dr.left) + 'px';
    selBox.style.top = (sy - dr.top) + 'px';
    selBox.style.width = '0px';
    selBox.style.height = '0px';
    $$('.desk-icon').forEach(x => x.classList.remove('selected'));
  });
  desktop.addEventListener('pointermove', e => {
    if (!active) return;
    const dr = desktop.getBoundingClientRect();
    const x1 = Math.min(sx, e.clientX), x2 = Math.max(sx, e.clientX);
    const y1 = Math.min(sy, e.clientY), y2 = Math.max(sy, e.clientY);
    selBox.style.left = (x1 - dr.left) + 'px';
    selBox.style.top = (y1 - dr.top) + 'px';
    selBox.style.width = (x2 - x1) + 'px';
    selBox.style.height = (y2 - y1) + 'px';
    $$('.desk-icon').forEach(ic => {
      const r = ic.getBoundingClientRect();
      const hit = !(r.right < x1 || r.left > x2 || r.bottom < y1 || r.top > y2);
      ic.classList.toggle('selected', hit);
    });
  });
  const end = () => { if (!active) return; active = false; selBox.style.display = 'none'; };
  desktop.addEventListener('pointerup', end);
  desktop.addEventListener('pointercancel', end);
})();

/* ============================================================
   17. 开始菜单
   ============================================================ */
function buildStartMenu() {
  startMenu.innerHTML =
    '<input id="startSearch" placeholder="搜索应用…" autocomplete="off">' +
    '<div class="start-grid"></div>' +
    '<div class="start-foot">WebOS 1.3 · ' + Object.keys(APPS).length + ' 个应用 · 缓存 ' + Cache.stats().pretty + '</div>';

  const grid = startMenu.querySelector('.start-grid');

  function renderGrid(q) {
    q = (q || '').trim().toLowerCase();
    grid.innerHTML = '';
    let count = 0;
    Object.keys(APPS).forEach(key => {
      const app = APPS[key];
      if (q && app.name.toLowerCase().indexOf(q) === -1 && key.indexOf(q) === -1) return;
      count++;
      const b = document.createElement('button');
      b.className = 'start-app';
      b.innerHTML = '<span class="ic">' + app.icon + '</span><span>' + esc(app.name) + '</span>';
      b.addEventListener('click', () => { toggleStart(false); app.open(); });
      grid.appendChild(b);
    });
    if (!count) grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-dim);font-size:12px;padding:24px">没有找到匹配的应用</div>';
  }
  renderGrid('');

  const inp = startMenu.querySelector('#startSearch');
  inp.addEventListener('input', () => renderGrid(inp.value));
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { const f = grid.querySelector('.start-app'); if (f) f.click(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); const f = grid.querySelector('.start-app'); if (f) f.focus(); }
  });
  grid.addEventListener('keydown', e => {
    const items = $$('.start-app', grid);
    const i = items.indexOf(document.activeElement);
    if (i < 0) return;
    let n = -1;
    if (e.key === 'ArrowRight') n = i + 1;
    else if (e.key === 'ArrowLeft') n = i - 1;
    else if (e.key === 'ArrowDown') n = i + 4;
    else if (e.key === 'ArrowUp') n = i - 4;
    if (n >= 0 && n < items.length) { e.preventDefault(); items[n].focus(); }
    else if (e.key === 'ArrowUp' && i < 4) { e.preventDefault(); inp.focus(); }
  });
}
buildStartMenu();

const startBtn = $('#startBtn');
function toggleStart(force) {
  const show = typeof force === 'boolean' ? force : !startMenu.classList.contains('show');
  startMenu.classList.toggle('show', show);
  startBtn.classList.toggle('active', show);
  if (show) {
    const foot = startMenu.querySelector('.start-foot');
    if (foot) foot.textContent = 'WebOS 1.3 · ' + Object.keys(APPS).length + ' 个应用 · ' + NAV_LINKS.length + ' 个链接 · 缓存 ' + Cache.stats().pretty;
    const inp = startMenu.querySelector('#startSearch');
    if (inp) { inp.value = ''; inp.dispatchEvent(new Event('input')); setTimeout(() => inp.focus(), 30); }
  }
}
startBtn.addEventListener('click', e => { e.stopPropagation(); toggleStart(); });

/* ============================================================
   18. 右键菜单
   ============================================================ */
function showMenu(x, y, items) {
  ctxMenu.innerHTML = '';
  items.forEach(it => {
    if (it.sep) {
      const s = document.createElement('div');
      s.className = 'menu-sep';
      ctxMenu.appendChild(s);
      return;
    }
    const b = document.createElement('button');
    b.className = 'menu-item' + (it.danger ? ' danger' : '');
    b.innerHTML = '<span class="mi-ic">' + (it.icon || '') + '</span><span>' + esc(it.label) + '</span>' +
      (it.key ? '<span class="mi-key">' + it.key + '</span>' : '');
    b.addEventListener('click', () => { hideMenu(); if (it.action) it.action(); });
    ctxMenu.appendChild(b);
  });
  ctxMenu.classList.add('show');
  ctxMenu.style.left = '-9999px';
  ctxMenu.style.top = '-9999px';
  const w = ctxMenu.offsetWidth, h = ctxMenu.offsetHeight;
  ctxMenu.style.left = Math.max(4, Math.min(x, window.innerWidth - w - 6)) + 'px';
  ctxMenu.style.top = Math.max(4, Math.min(y, window.innerHeight - h - 6)) + 'px';
}
function hideMenu() { ctxMenu.classList.remove('show'); }

document.addEventListener('contextmenu', e => {
  e.preventDefault();

  const iconEl = e.target.closest('.desk-icon');
  if (iconEl) {
    const app = APPS[iconEl.dataset.app];
    showMenu(e.clientX, e.clientY, [
      { icon: '📂', label: '打开', action: () => app.open(), key: '⏎' },
      { sep: true },
      { icon: '🧹', label: '取消选中', action: () => $$('.desk-icon').forEach(x => x.classList.remove('selected')) },
      { icon: '🔄', label: '重新排列图标', action: resetIconPositions }
    ]);
    return;
  }

  if (e.target.closest('.window') || e.target.closest('#taskbar') ||
      e.target.closest('#startMenu') || e.target.closest('.popover') ||
      e.target.closest('.menu') || e.target.closest('#toasts') ||
      e.target.closest('#notifyCenter')) {
    hideMenu();
    return;
  }

  showMenu(e.clientX, e.clientY, [
    { icon: '🌐', label: '网址导航', action: () => openWebNav() },
    { icon: '📁', label: '文件管理器', action: () => openFiles([]) },
    { icon: '📝', label: '新建便签', action: () => openNotepad({ content: '', name: '无标题.txt' }) },
    { sep: true },
    { icon: '🔄', label: '重新排列图标', action: resetIconPositions },
    { icon: '🎨', label: '更换壁纸', action: () => { setWallpaper(currentWall + 1); notify('桌面', '壁纸已更换', '🎨'); } },
    { sep: true },
    { icon: '🖥️', label: '显示设置', action: () => openSettings() },
    { icon: '⌨️', label: '打开终端', action: () => openTerminal() }
  ]);
});

/* ============================================================
   19. 时钟 / 日历
   ============================================================ */
const clockEl = $('#clock');
function tickClock() {
  const d = new Date();
  clockEl.textContent = pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + '  ' + (d.getMonth() + 1) + '/' + d.getDate();
}
tickClock();
setInterval(tickClock, 1000);

let calYear, calMonth;
function renderCalendar() {
  const now = new Date();
  const todayStr = now.getFullYear() + '-' + (now.getMonth() + 1) + '-' + now.getDate();
  const first = new Date(calYear, calMonth, 1);
  const startWd = first.getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const daysInPrev = new Date(calYear, calMonth, 0).getDate();

  let html = '<div class="cal-head">' +
    '<button data-nav="-1">‹</button>' +
    '<b>' + calYear + ' 年 ' + (calMonth + 1) + ' 月</b>' +
    '<button data-nav="1">›</button></div>';

  html += '<div class="cal-grid">';
  ['日', '一', '二', '三', '四', '五', '六'].forEach(w => { html += '<div class="wd">' + w + '</div>'; });
  for (let i = startWd - 1; i >= 0; i--) html += '<div class="d other">' + (daysInPrev - i) + '</div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const key = calYear + '-' + (calMonth + 1) + '-' + d;
    html += '<div class="d' + (key === todayStr ? ' today' : '') + '">' + d + '</div>';
  }
  const rest = (7 - ((startWd + daysInMonth) % 7)) % 7;
  for (let d = 1; d <= rest; d++) html += '<div class="d other">' + d + '</div>';
  html += '</div>';
  html += '<div class="cal-now">' + pad2(now.getHours()) + ':' + pad2(now.getMinutes()) + ':' + pad2(now.getSeconds()) + '</div>';

  calPop.innerHTML = html;
  $$('button[data-nav]', calPop).forEach(b => {
    b.addEventListener('click', () => {
      calMonth += parseInt(b.dataset.nav, 10);
      if (calMonth < 0) { calMonth = 11; calYear--; }
      if (calMonth > 11) { calMonth = 0; calYear++; }
      renderCalendar();
    });
  });
}

let calTimer = null;
clockEl.addEventListener('click', e => {
  e.stopPropagation();
  notifyCenter.classList.remove('show');
  if (calPop.classList.contains('show')) { calPop.classList.remove('show'); clearInterval(calTimer); return; }
  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
  renderCalendar();
  calPop.classList.add('show');
  clearInterval(calTimer);
  calTimer = setInterval(() => {
    const n = new Date();
    const el = calPop.querySelector('.cal-now');
    if (el) el.textContent = pad2(n.getHours()) + ':' + pad2(n.getMinutes()) + ':' + pad2(n.getSeconds());
  }, 1000);
});

/* 托盘 */
$('#themeBtn').addEventListener('click', () => {
  const t = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
  setTheme(t);
  notify('主题', '已切换到' + (t === 'dark' ? '深色' : '浅色') + '模式', t === 'dark' ? '🌙' : '☀️');
});
$('#notifyBtn').addEventListener('click', e => { e.stopPropagation(); openNotifyCenter(); });

/* ============================================================
   20. 全局交互 & 快捷键
   ============================================================ */
document.addEventListener('pointerdown', e => {
  if (!e.target.closest('#startMenu') && !e.target.closest('#startBtn')) toggleStart(false);
  if (!e.target.closest('#contextMenu')) hideMenu();
  if (!e.target.closest('#calendarPop') && !e.target.closest('#clock')) {
    calPop.classList.remove('show');
    clearInterval(calTimer);
  }
  if (!e.target.closest('#notifyCenter') && !e.target.closest('#notifyBtn')) {
    notifyCenter.classList.remove('show');
  }
  if (!e.target.closest('.desk-icon') && e.target === desktop) {
    $$('.desk-icon').forEach(x => x.classList.remove('selected'));
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    toggleStart(false);
    hideMenu();
    calPop.classList.remove('show');
    clearInterval(calTimer);
    notifyCenter.classList.remove('show');
    return;
  }
  if (e.altKey && e.key === 'Tab') { e.preventDefault(); cycleWindows(); return; }
  if (e.key === 'Meta') { e.preventDefault(); toggleStart(); return; }
  if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 't') { e.preventDefault(); openTerminal(); return; }
  if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 'e') { e.preventDefault(); openFiles(); return; }
  if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 's') { e.preventDefault(); openSettings(); return; }
  if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 'w') { e.preventDefault(); openWebNav(); return; }
});

window.addEventListener('resize', () => {
  wins.forEach(win => {
    if (win.maximized) return;
    if (win.snap === 'left') {
      win.el.style.width = (desktop.clientWidth / 2 - 9) + 'px';
      win.el.style.height = (desktop.clientHeight - 12) + 'px';
      return;
    }
    if (win.snap === 'right') {
      win.el.style.left = (desktop.clientWidth / 2 + 3) + 'px';
      win.el.style.width = (desktop.clientWidth / 2 - 9) + 'px';
      win.el.style.height = (desktop.clientHeight - 12) + 'px';
      return;
    }
    const maxX = Math.max(0, desktop.clientWidth - win.el.offsetWidth);
    const maxY = Math.max(0, desktop.clientHeight - win.el.offsetHeight);
    win.el.style.left = Math.min(parseInt(win.el.style.left, 10) || 0, maxX) + 'px';
    win.el.style.top = Math.min(parseInt(win.el.style.top, 10) || 0, maxY) + 'px';
  });
  if (calPop.classList.contains('show')) renderCalendar();
});

desktop.addEventListener('dragstart', e => e.preventDefault());

/* ============================================================
   21. 会话保存 / 恢复
   ============================================================ */
function saveSession() {
  const session = [];
  wins.forEach(w => {
    if (w.appId === 'term') return;                 // 终端不恢复
    if (w.appId.indexOf('url::') === 0) return;     // 外部网页窗口不恢复
    const state = w.api.getState ? (() => { try { return w.api.getState(); } catch(e){ return null; } })() : null;
    session.push({
      appId: w.appId,
      title: w.title,
      icon: w.icon,
      left: w.el.style.left,
      top: w.el.style.top,
      width: w.el.style.width,
      height: w.el.style.height,
      minimized: w.minimized,
      maximized: w.maximized,
      snap: w.snap,
      state
    });
  });
  Cache.set('session', session);
}

function restoreSession() {
  if (!Cache.get('autoSave', true)) return 0;
  const session = Cache.get('session', []);
  if (!session.length) return 0;
  let restored = 0;
  session.forEach(s => {
    const app = APPS[s.appId];
    if (!app) return;
    try {
      let win;
      if (s.appId === 'notepad' && s.state && s.state.filePath) {
        const node = fsResolve(s.state.filePath.slice(0, -1));
        const name = s.state.filePath[s.state.filePath.length - 1];
        if (node && node.children[name]) {
          win = openNotepad({ content: node.children[name].content || '', name, path: s.state.filePath });
        } else win = app.open();
      } else if (s.appId === 'files' && s.state && s.state.path) {
        win = openFiles(s.state.path);
      } else if (s.appId === 'webnav' && s.state && s.state.key) {
        win = openWebNav(s.state.key);
      } else {
        win = app.open();
      }
      if (!win || !win.el) return;
      if (!s.maximized && !s.snap) {
        win.el.style.left = s.left;
        win.el.style.top = s.top;
        win.el.style.width = s.width;
        win.el.style.height = s.height;
      }
      if (s.maximized) maxWin(win);
      if (s.snap === 'left' || s.snap === 'right') {
        const dw2 = desktop.clientWidth, dh2 = desktop.clientHeight;
        if (s.snap === 'left') {
          win.el.style.left = '6px'; win.el.style.top = '6px';
          win.el.style.width = (dw2 / 2 - 9) + 'px';
          win.el.style.height = (dh2 - 12) + 'px';
        } else {
          win.el.style.left = (dw2 / 2 + 3) + 'px'; win.el.style.top = '6px';
          win.el.style.width = (dw2 / 2 - 9) + 'px';
          win.el.style.height = (dh2 - 12) + 'px';
        }
        win.snap = s.snap;
      }
      if (s.minimized) minWin(win);
      if (win.api.onResize) setTimeout(win.api.onResize, 50);
      restored++;
    } catch (e) {}
  });
  return restored;
}

/* 关闭前保存会话 */
window.addEventListener('beforeunload', () => {
  if (!Cache.get('autoSave', true)) return;
  saveSession();
  const np = findWin('notepad');
  if (np && np.api.getText) Cache.set('notepad.draft', np.api.getText());
});

/* 定期保存（每 20 秒） */
setInterval(() => {
  if (Cache.get('autoSave', true) && wins.size) saveSession();
}, 20000);

/* ============================================================
   22. 启动
   ============================================================ */
window.addEventListener('load', () => {
  setTimeout(() => {
    /* 首次运行时的版本迁移检查 */
    const mig = Cache.checkVersion();
    if (mig.migrated && mig.from) {
      notify('缓存已更新', '数据格式已从 v' + mig.from + ' 迁移到 v' + mig.to, '🔄', { type: 'ok' });
    }

    const boot = $('#boot');
    boot.classList.add('hide');
    setTimeout(() => boot.remove(), 600);

    setTimeout(() => {
      /* 尝试恢复上次会话 */
      const restored = restoreSession();

      if (!restored) {
        openNotepad({
          content:
            '🎉 欢迎使用 WebOS 网页桌面 v1.3！\n\n' +
            '【本次更新：网址导航】\n' +
            '· 原 index.html 的全部链接已迁移到桌面「🌐 网址导航」应用\n' +
            '· 共 ' + NAV_LINKS.length + ' 个链接，' + Object.keys(NAV_CATEGORIES).length + ' 个分类\n' +
            '· 支持搜索、收藏、最近访问\n' +
            '· 点击链接可在系统窗口内嵌打开（AI/小说/海外类会新标签页打开）\n' +
            '· 在「设置 → 网址导航」里可以导入 / 导出 / 恢复链接数据\n\n' +
            '【原有能力】\n' +
            '· 统一的缓存层 Cache，命名空间 webos::\n' +
            '· 版本化包装（v2），为未来迁移留了接口\n' +
            '· 存储配额自动兜底，写满时会自动清理最旧数据\n' +
            '· 跨标签页实时同步（试试开两个标签）\n' +
            '· 设置里可以查看每项缓存大小，逐项删除\n' +
            '· 支持一键导出 / 导入备份（JSON 格式）\n' +
            '· 关闭页面自动保存会话，下次打开自动恢复\n\n' +
            '【小提示】\n' +
            '· 终端输入 cache 查看缓存，输入 open webnav 打开网址导航\n' +
            '· 快捷键 Ctrl+Alt+W 直接打开网址导航\n' +
            '· 所有数据都在你的浏览器里，不会上传\n\n' +
            '祝你玩得开心 🚀',
          name: '欢迎.txt'
        });
      }

      setTimeout(() => {
        const s = Cache.stats();
        notify('WebOS 已就绪',
          restored
            ? '已恢复 ' + restored + ' 个窗口 · 缓存 ' + s.pretty
            : NAV_LINKS.length + ' 个网址已就绪 · 缓存 ' + s.pretty,
          '✨', { type: 'ok' });
      }, 900);
    }, 350);
  }, 1500);
});
