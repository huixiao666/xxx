    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            overflow: hidden; height: 100vh; width: 100vw;
            background: #0b0e1a; color: #fff; touch-action: none;
        }
        #desktop {
            position: relative; width: 100vw; height: 100vh;
            background: radial-gradient(ellipse at 30% 40%, #1a1f3a, #0b0e1a 70%);
            overflow: hidden; touch-action: none;
        }
        .star {
            position: absolute; border-radius: 50%; background: #fff;
            animation: twinkle var(--dur) ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.15; transform: scale(0.7); }
            100% { opacity: 1; transform: scale(1.3); }
        }
        .desktop-icon {
            position: absolute; display: flex; flex-direction: column; align-items: center;
            justify-content: center; cursor: pointer; transition: transform 0.2s, background 0.2s;
            touch-action: manipulation; padding: 16px 12px 12px; border-radius: 16px;
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.04);
            width: 130px; height: 130px;
        }
        .desktop-icon:hover { background: rgba(255, 255, 255, 0.08); transform: scale(1.04); }
        .desktop-icon:active { transform: scale(0.94); }
        .desktop-icon .big-icon {
            font-size: 72px; line-height: 1; filter: drop-shadow(0 8px 24px rgba(0,0,0,0.6));
            margin-bottom: 8px;
        }
        .desktop-icon .big-label {
            font-size: 18px; font-weight: 500; text-shadow: 0 2px 12px rgba(0,0,0,0.8);
            letter-spacing: 0.5px; background: rgba(0,0,0,0.30); padding: 2px 16px;
            border-radius: 40px; backdrop-filter: blur(4px);
        }
        #myComputerDesktop { left: 36px; top: 36px; }
        #toolboxDesktop { left: 180px; top: 36px; }
        @media (max-width: 768px) {
            .desktop-icon { width: 100px; height: 100px; padding: 12px 10px 10px; }
            .desktop-icon .big-icon { font-size: 52px; }
            .desktop-icon .big-label { font-size: 15px; padding: 2px 12px; }
            #myComputerDesktop { left: 20px; top: 20px; }
            #toolboxDesktop { left: 130px; top: 20px; }
        }
        @media (max-width: 480px) {
            .desktop-icon { width: 80px; height: 80px; padding: 8px 6px 6px; border-radius: 12px; }
            .desktop-icon .big-icon { font-size: 40px; }
            .desktop-icon .big-label { font-size: 12px; padding: 1px 10px; }
            #myComputerDesktop { left: 14px; top: 14px; }
            #toolboxDesktop { left: 100px; top: 14px; }
        }
        #windows {
            position: fixed; top: 0; left: 0; width: 100%; height: calc(100% - 52px);
            pointer-events: none; z-index: 100;
        }
        #windows>* { pointer-events: auto; }
        .window {
            position: absolute; min-width: 300px; min-height: 200px;
            max-width: 92vw; max-height: 85vh;
            background: rgba(22, 28, 50, 0.82); backdrop-filter: blur(24px) saturate(1.2);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 16px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04) inset;
            display: flex; flex-direction: column; overflow: hidden;
            animation: windowIn 0.26s cubic-bezier(0.34, 1.56, 0.64, 1);
            touch-action: none;
        }
        .window.active {
            box-shadow: 0 28px 96px rgba(0,0,0,0.85), 0 0 0 1px rgba(255,255,255,0.10) inset;
        }
        .window.maximized {
            width: 100% !important; height: calc(100% - 52px) !important;
            max-width: 100% !important; max-height: calc(100% - 52px) !important;
            top: 0 !important; left: 0 !important; border-radius: 0;
        }
        @keyframes windowIn {
            0% { opacity: 0; transform: scale(0.92) translateY(18px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }

        .win-titlebar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 14px 8px 18px; background: rgba(255,255,255,0.04);
            border-bottom: 1px solid rgba(255,255,255,0.06); cursor: grab;
            min-height: 44px; touch-action: none;
        }
        .win-titlebar:active { cursor: grabbing; }
        .win-title {
            display: flex; align-items: center; gap: 10px; font-size: 14px;
            font-weight: 600; color: rgba(255,255,255,0.88); flex: 1; min-width: 0;
        }
        .win-title .win-icon { font-size: 18px; opacity: 0.8; }
        .win-title .win-title-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .win-controls { display: flex; gap: 6px; flex-shrink: 0; }
        .win-controls button {
            width: 30px; height: 30px; border: none; border-radius: 50%;
            background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.7);
            font-size: 14px; cursor: pointer; transition: background 0.2s, transform 0.15s;
            display: flex; align-items: center; justify-content: center; line-height: 1;
            touch-action: manipulation;

        .win-controls button:hover { background: rgba(255,255,255,0.14); color: #fff; }
        .win-controls .btn-maximize:hover { background: rgba(76, 201, 240, 0.3); color: #4cc9f0; }
        .win-controls .btn-close:hover { background: #e74c3c; color: #fff; transform: scale(1.08); }
        .win-body {
            flex: 1; padding: 16px 20px 20px; overflow-y: auto;
            color: rgba(255,255,255,0.92); font-size: 14px; line-height: 1.6;
            -webkit-overflow-scrolling: touch;
        }
        .win-body::-webkit-scrollbar { width: 4px; }
        .win-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.20); border-radius: 8px; }
        .win-body.iframe-body { padding: 0; overflow: hidden; position: relative; }
        .win-body.iframe-body iframe { width: 100%; height: 100%; border: none; display: block; }
        .win-body .iframe-error {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100%; color: rgba(255,255,255,0.6); gap: 12px; padding: 20px;
            text-align: center; animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .win-body .iframe-error .error-icon { font-size: 48px; }
        .win-body .iframe-error .error-title { font-size: 18px; font-weight: 500; color: rgba(255,255,255,0.8); }
        .win-body .iframe-error .error-desc { font-size: 13px; color: rgba(255,255,255,0.4); max-width: 400px; }
        .win-body .iframe-error .error-timer { font-size: 14px; color: rgba(255,255,255,0.5); margin-top: 4px; }
        .win-body .iframe-error .error-btn {

            transition: background 0.2s, transform 0.1s; font-family: inherit;
            touch-action: manipulation; font-weight: 500;

        .win-body .iframe-error .error-btn:hover { background: rgba(255,255,255,0.22); }
        .win-body .iframe-error .error-btn:active { transform: scale(0.96); }
        .win-resize {
            position: absolute; bottom: 4px; right: 4px; width: 18px; height: 18px;
            cursor: nwse-resize; background: transparent; z-index: 10; touch-action: none;
        }
        .win-resize::after {
            content: ""; position: absolute; bottom: 2px; right: 2px;
            width: 12px; height: 12px; border-right: 2px solid rgba(255,255,255,0.3);
            border-bottom: 2px solid rgba(255,255,255,0.3); border-radius: 0 0 4px 0;
            transition: border-color 0.2s;
        }
        .win-resize:hover::after, .win-resize:active::after { border-color: rgba(255,255,255,0.7); }

            word-break: break-all;
        }
        .calc-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .calc-buttons button {
            padding: 14px 0; font-size: 20px; border-radius: 8px; border: none;
            background: rgba(255,255,255,0.08); color: #fff; cursor: pointer;

        .calendar .day.empty { background: transparent; }

        .color-value { font-size: 18px; font-family: monospace; }
        .random-container { display: flex; flex-direction: column; gap: 16px; align-items: center; }

        @media (max-width: 480px) {

            const win = document.createElement('div');

            titlebar.querySelector('.btn-maximize').addEventListener('click', (e) => { e.stopPropagation(); toggleMaximize(win); });

            if (cfg.content === 'timer') bindTimer(body);
            if (cfg.content === 'calendar') bindCalendar(body);
            if (cfg.content === 'colorpicker') bindColorPicker(body);

        function bindCalculator(body) {
            const display = body.querySelector('.calc-display');
            const buttons = body.querySelectorAll('.calc-buttons button');
            let expression = '';
            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const val = btn.textContent;
                    if (val === 'C') { expression = ''; display.textContent = '0'; }
                    else if (val === '=') {
                        try { expression = eval(expression).toString(); display.textContent = expression; } catch (e) { display.textContent = '错误'; expression = ''; }
                    } else {
                        if (expression === '0' && val !== '.') expression = '';
                        expression += val;
                        display.textContent = expression;
                    }
                });
            });
        }

        function bindTimer(body) {
            const display = body.querySelector('.timer-display');
            const minInput = body.querySelector('#timerMinutes');
            const secInput = body.querySelector('#timerSeconds');
            const startBtn = body.querySelector('#timerStart');
            const pauseBtn = body.querySelector('#timerPause');
            const resetBtn = body.querySelector('#timerReset');
            let totalSeconds = 0, interval = null;
            function updateDisplay() {
                const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
                const s = (totalSeconds % 60).toString().padStart(2, '0');
                display.textContent = m + ':' + s;
            }
            function resetTimer() {
                clearInterval(interval);
                interval = null;
                const min = parseInt(minInput.value) || 0;
                const sec = parseInt(secInput.value) || 0;
                totalSeconds = min * 60 + sec;
                updateDisplay();
            }
            startBtn.addEventListener('click', () => {
                if (interval) return;
                if (totalSeconds <= 0) resetTimer();
                interval = setInterval(() => {
                    if (totalSeconds <= 0) { clearInterval(interval); interval = null; return; }
                    totalSeconds--;
                    updateDisplay();
                }, 1000);
            });
            pauseBtn.addEventListener('click', () => { clearInterval(interval); interval = null; });
            resetBtn.addEventListener('click', resetTimer);
            resetTimer();
        }

        function bindCalendar(body) {
            const grid = body.querySelector('#calendarGrid');
            const prevBtn = body.querySelector('.cal-prev');
            const nextBtn = body.querySelector('.cal-next');
            const monthYearSpan = body.querySelector('.cal-month-year');
            let currentDate = new Date();
            function render() {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                monthYearSpan.textContent = `${year}年 ${month+1}月`;
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month+1, 0).getDate();
                let html = `<div class="day-header">日</div><div class="day-header">一</div><div class="day-header">二</div><div class="day-header">三</div><div class="day-header">四</div><div class="day-header">五</div><div class="day-header">六</div>`;
                for (let i = 0; i < firstDay; i++) html += `<div class="day empty"></div>`;
                const today = new Date();
                for (let d = 1; d <= daysInMonth; d++) {
                    const isToday = (year === today.getFullYear() && month === today.getMonth() && d === today.getDate());
                    html += `<div class="day${isToday ? ' today' : ''}">${d}</div>`;
                }
                grid.innerHTML = html;
            }
            prevBtn.addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth()-1); render(); });
            nextBtn.addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth()+1); render(); });
            render();
        }

        // 核心：根据分类决定打开方式
        window.openLinkData = function(encodedData) {
            let item;
            try { item = JSON.parse(decodeURIComponent(encodedData)); } catch (e) { return; }
            if (!item || !item.url) return;
            if (NO_IFRAME_CATEGORIES.includes(item.category)) {
                window.open(item.url, '_blank');
            } else {
                openLinkInWindow(item);
            }
        };

        function openLinkInWindow(item) {
            const url = item.url;
            const winId = 'link_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            const win = document.createElement('div');
            win.className = 'window';
            win.dataset.winId = winId;
            const maxW = window.innerWidth * 0.88, maxH = window.innerHeight * 0.80;
            const w = Math.min(800, maxW), h = Math.min(600, maxH);
            win.style.width = w + 'px'; win.style.height = h + 'px';
            const titlebar = document.createElement('div');
            titlebar.className = 'win-titlebar';
            titlebar.innerHTML = `
                <div class="win-title"><span class="win-icon">${item.emoji || '🌐'}</span><span class="win-title-text">${item.name || '网页'}</span></div>
                <div class="win-controls"><button class="btn-min" title="最小化">─</button><button class="btn-maximize" title="最大化">□</button><button class="btn-close" title="关闭">✕</button></div>`;
            titlebar.querySelector('.btn-close').addEventListener('click', (e) => { e.stopPropagation(); closeWindowById(winId); });
            titlebar.querySelector('.btn-min').addEventListener('click', (e) => { e.stopPropagation(); minimizeWindow(winId); });
            titlebar.querySelector('.btn-maximize').addEventListener('click', (e) => { e.stopPropagation(); toggleMaximize(win); });
            titlebar.addEventListener('mousedown', (e) => { if (!e.target.closest('.win-controls')) startDrag(e, win); });
            titlebar.addEventListener('touchstart', (e) => { if (!e.target.closest('.win-controls') && e.touches.length === 1) startDrag(e, win); }, { passive: false });
            win.appendChild(titlebar);
            const body = document.createElement('div');
            body.className = 'win-body';
            body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:rgba(255,255,255,0.5);">⏳ 正在加载...</div>';
            win.appendChild(body);
            windowsContainer.appendChild(win);
            const winData = { id: winId, element: win, title: item.name || '网页', icon: item.emoji || '🌐', minimized: false, maximized: false, prevState: null };
            openWindows.push(winData);
            updateTaskbar(); focusWindow(win); centerWindow(win); addResizeHandle(win);

            // 使用 fetch 预检网络连通性，避免长时间挂起
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 3000);
            fetch(url, { method: 'HEAD', mode: 'no-cors', signal: controller.signal })
                .then(() => {
                    clearTimeout(timeout);
                    setupIframe(win, body, item, winId);
                })
                .catch(() => {
                    clearTimeout(timeout);
                    window.open(url, '_blank');
                    closeWindowById(winId);
                });
        }

        function setupIframe(win, body, item, winId) {
            body.className = 'win-body iframe-body';
            body.innerHTML = '';
            const iframe = document.createElement('iframe');
            iframe.src = item.url;
            iframe.sandbox = 'allow-scripts allow-same-origin allow-forms allow-popups';
            iframe.style.width = '100%'; iframe.style.height = '100%'; iframe.style.border = 'none';
            let loadFinished = false, loadFailed = false, timeoutId = null;

            iframe.addEventListener('load', function() {
                if (loadFailed || loadFinished) return;
                clearTimeout(timeoutId);
                loadFinished = true;
                try {
                    const loc = iframe.contentWindow.location.href;
                    if (loc === 'about:blank') {
                        showErrorAndRedirect('🚫', '无法嵌入', '该网站禁止在框架中显示，将自动在新标签页打开', item.url, win, winId, body);
                    }
                } catch (e) { /* 跨域加载成功 */ }
            });

            iframe.onerror = function() {
                if (loadFailed || loadFinished) return;
                clearTimeout(timeoutId);
                loadFailed = true;
                showErrorAndRedirect('⚠️', '加载失败', '网络错误，将自动在新标签页打开', item.url, win, winId, body);
            };

            timeoutId = setTimeout(() => {
                if (loadFailed || loadFinished) return;
                loadFailed = true;
                showErrorAndRedirect('⏱️', '连接超时', '网站响应超时，将自动在新标签页打开', item.url, win, winId, body);
            }, 5000);

            body.appendChild(iframe);

            function showErrorAndRedirect(icon, title, desc, url, winElement, winId, bodyEl) {
                if (loadFailed && bodyEl.querySelector('.iframe-error')) return;
                loadFailed = true;
                bodyEl.innerHTML = `
                    <div class="iframe-error">
                        <div class="error-icon">${icon}</div><div class="error-title">${title}</div><div class="error-desc">${desc}</div>
                        <div style="font-size:12px;color:rgba(255,255,255,0.3);word-break:break-all;max-width:400px;">${url}</div>
                        <div class="error-timer">⏳ 即将跳转...</div>
                        <button class="error-btn" onclick="window.open('${url}','_blank'); window.closeWindowById('${winId}')">📂 立即在新标签页打开</button>
                    </div>`;
                bodyEl.className = 'win-body';
                setTimeout(() => { window.open(url, '_blank'); window.closeWindowById(winId); }, 1000);
            }
        }

        window.closeWindowById = function(winId) {
            const idx = openWindows.findIndex(w => w.id === winId);
            if (idx !== -1) {
                openWindows[idx].element.remove();
                openWindows.splice(idx, 1);
                updateTaskbar();
                if (openWindows.length > 0) focusWindow(openWindows[openWindows.length - 1].element);
            }
        };

        window.addCustomLink = function() {
            const name = prompt('请输入链接名称：', '我的网站');
            if (!name || !name.trim()) return;
            const url = prompt('请输入网址 (包含 http:// 或 https://)：', 'https://example.com');
            if (!url || !url.trim()) return;
            let finalUrl = url.trim();
            if (!finalUrl.startsWith('http://') && !finalUrl.startsWith('https://')) finalUrl = 'https://' + finalUrl;
            const emoji = prompt('请输入图标表情符号（如 🌐）：', '🌐') || '🌐';
            const category = prompt('请输入分类（AI/视频/动漫/小说/社交/游戏/购物/工具/搜图/海外/影视/群友/皮卡）：', '工具');
            const validCategories = Object.keys(CATEGORIES);
            const finalCategory = validCategories.includes(category) ? category : '工具';
            LINK_DATA.push({ name: name.trim(), emoji, url: finalUrl, category: finalCategory });
            const winData = openWindows.find(w => w.id === 'computer');
            if (winData) { const body = winData.element.querySelector('.win-body'); if (body) body.innerHTML = currentCategory ? renderCategoryView(currentCategory) : renderFolderView(); }
        };
        window.openTool = openTool;

        function focusWindow(win) { winZIndex++; win.style.zIndex = winZIndex; win.classList.add('active'); $$('.window').forEach(w => { if (w !== win) w.classList.remove('active'); }); }
        function closeWindow(iconId) { const idx = openWindows.findIndex(w => w.id === iconId); if (idx === -1) return; openWindows[idx].element.remove(); openWindows.splice(idx,1); updateTaskbar(); if (openWindows.length>0) focusWindow(openWindows[openWindows.length-1].element); }
        function minimizeWindow(iconId) { const winData = openWindows.find(w => w.id === iconId); if (!winData) return; winData.element.style.display = winData.minimized ? 'flex' : 'none'; winData.minimized = !winData.minimized; updateTaskbar(); }
        function toggleMaximize(win) {
            const winData = openWindows.find(w => w.element === win); if (!winData) return;
            if (winData.maximized) {
                win.classList.remove('maximized');
                if (winData.prevState) { win.style.width = winData.prevState.width; win.style.height = winData.prevState.height; win.style.left = winData.prevState.left; win.style.top = winData.prevState.top; }
                else centerWindow(win);
                winData.maximized = false; win.querySelector('.btn-maximize').textContent = '□';
            } else {
                const rect = win.getBoundingClientRect();
                winData.prevState = { width: rect.width+'px', height: rect.height+'px', left: win.style.left, top: win.style.top };
                win.classList.add('maximized'); winData.maximized = true; win.querySelector('.btn-maximize').textContent = '❐';
            }
        }
        function centerWindow(win) { const rect = win.getBoundingClientRect(); win.style.left = clamp((window.innerWidth-rect.width)/2, 8, window.innerWidth-rect.width-8)+'px'; win.style.top = clamp((window.innerHeight-rect.height)/2-20, 8, window.innerHeight-rect.height-60)+'px'; }
        function addResizeHandle(win) { const handle = document.createElement('div'); handle.className='win-resize'; win.appendChild(handle); handle.addEventListener('mousedown', (e)=>{ e.stopPropagation(); e.preventDefault(); startResize(e,win); }); handle.addEventListener('touchstart', (e)=>{ if(e.touches.length===1){ e.stopPropagation(); e.preventDefault(); startResize(e,win); } },{passive:false}); }
        function startResize(e,win) { if(win.classList.contains('maximized')) return; const isTouch=e.type==='touchstart'; const clientX=isTouch?e.touches[0].clientX:e.clientX; const clientY=isTouch?e.touches[0].clientY:e.clientY; const rect=win.getBoundingClientRect(); resizeData={win,startX:clientX,startY:clientY,startWidth:rect.width,startHeight:rect.height,isTouch}; if(isTouch){ document.addEventListener('touchmove',onResizeMove,{passive:false}); document.addEventListener('touchend',onResizeEnd); } else { document.addEventListener('mousemove',onResizeMove); document.addEventListener('mouseup',onResizeEnd); } }
        function onResizeMove(e) { if(!resizeData) return; const clientX=resizeData.isTouch?e.touches[0].clientX:e.clientX; const clientY=resizeData.isTouch?e.touches[0].clientY:e.clientY; const{win,startX,startY,startWidth,startHeight}=resizeData; let w=Math.max(300,startWidth+(clientX-startX)); let h=Math.max(200,startHeight+(clientY-startY)); const rect=win.getBoundingClientRect(); w=Math.min(w,window.innerWidth-rect.left-8); h=Math.min(h,window.innerHeight-rect.top-60); win.style.width=w+'px'; win.style.height=h+'px'; if(resizeData.isTouch) e.preventDefault(); }
        function onResizeEnd() { resizeData=null; document.removeEventListener('mousemove',onResizeMove); document.removeEventListener('mouseup',onResizeEnd); document.removeEventListener('touchmove',onResizeMove); document.removeEventListener('touchend',onResizeEnd); }
        function startDrag(e,win) { if(win.classList.contains('maximized')||resizeData) return; const isTouch=e.type==='touchstart'; const clientX=isTouch?e.touches[0].clientX:e.clientX; const clientY=isTouch?e.touches[0].clientY:e.clientY; const rect=win.getBoundingClientRect(); dragData={win,offsetX:clientX-rect.left,offsetY:clientY-rect.top,isTouch}; if(isTouch){ document.addEventListener('touchmove',onDragMove,{passive:false}); document.addEventListener('touchend',onDragEnd); e.preventDefault(); } else { document.addEventListener('mousemove',onDragMove); document.addEventListener('mouseup',onDragEnd); e.preventDefault(); } }
        function onDragMove(e) { if(!dragData) return; const clientX=dragData.isTouch?e.touches[0].clientX:e.clientX; const clientY=dragData.isTouch?e.touches[0].clientY:e.clientY; const{win,offsetX,offsetY}=dragData; win.style.left=clamp(clientX-offsetX,4,window.innerWidth-win.offsetWidth-4)+'px'; win.style.top=clamp(clientY-offsetY,4,window.innerHeight-win.offsetHeight-60)+'px'; if(dragData.isTouch) e.preventDefault(); }
        function onDragEnd() { dragData=null; document.removeEventListener('mousemove',onDragMove); document.removeEventListener('mouseup',onDragEnd); document.removeEventListener('touchmove',onDragMove); document.removeEventListener('touchend',onDragEnd); }
        function updateTaskbar() { tbItems.innerHTML=''; openWindows.forEach(wd=>{ const btn=document.createElement('button'); btn.className='tb-btn'; if(wd.minimized) btn.style.opacity='0.5'; btn.innerHTML=`<span class="tb-icon">${wd.icon||'🌐'}</span> ${wd.title}`; btn.addEventListener('click',()=>{ if(wd.minimized){ wd.element.style.display='flex'; wd.minimized=false; updateTaskbar(); } focusWindow(wd.element); }); tbItems.appendChild(btn); }); }

        document.getElementById('myComputerDesktop').addEventListener('click', ()=> openWindow('computer'));
        document.getElementById('toolboxDesktop').addEventListener('click', ()=> openWindow('toolbox'));
        document.addEventListener('keydown', (e) => { if(e.key==='Escape'){ const active=document.querySelector('.window.active'); if(active){ const wd=openWindows.find(w=>w.element===active); if(wd&&wd.maximized) toggleMaximize(active); else closeWindow(active.dataset.winId); } } });
        setTimeout(()=> openWindow('computer'), 200);
    </script>
</body>
